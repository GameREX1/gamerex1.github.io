<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening GameRAX…</title>
</head>
<body>
  <p>Opening GameRAX…</p>

  <script>
    (function () {
      "use strict";

      // Preserve the complete game route, invite parameters and hash.
      var targetPath =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      var query = new URLSearchParams();
      query.set("__gamerex_path", targetPath);

      // Redirect to GameRAX while preserving the original route.
      window.location.replace("/?" + query.toString());
    })();
  </script>
</body>
</html>
