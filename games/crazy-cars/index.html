<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Crazy Cars - Gamerex</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,Helvetica,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 40%,rgba(35,55,90,.25),rgba(0,0,0,.88)),
    linear-gradient(135deg,#07111e,#101010);
}

.menu-box{
  width:min(560px,92vw);
  padding:35px;
  border-radius:24px;
  background:rgba(8,12,18,.92);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 25px 80px #000;
  text-align:center;
}

.logo{
  font-size:54px;
  font-weight:900;
  letter-spacing:-3px;
  color:#fff;
  text-shadow:0 5px 20px rgba(255,255,255,.2);
}

.logo span{
  color:#39d9ff;
}

.subtitle{
  color:#aaa;
  margin:8px 0 25px;
}

.menu-row{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 22px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  color:white;
  background:#202b38;
  transition:.15s;
}

button:hover{
  transform:translateY(-2px);
  background:#2e3d4e;
}

button.primary{
  background:#19aee0;
  color:#031018;
}

button.primary:hover{
  background:#42cfff;
}

select{
  width:100%;
  margin:8px 0;
  padding:13px;
  border-radius:10px;
  border:1px solid #394452;
  background:#151d26;
  color:#fff;
  font-size:15px;
}

.settings{
  text-align:left;
  margin:20px 0;
}

.settings label{
  display:block;
  color:#bbb;
  margin:8px 0 4px;
  font-size:13px;
}

#hud{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  display:none;
}

.topbar{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.badge{
  padding:10px 14px;
  border-radius:12px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(10px);
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
}

.badge strong{
  color:#4edbff;
}

#mapName{
  font-size:13px;
  color:#bbb;
}

#coins{
  font-size:17px;
}

#speedBox{
  position:absolute;
  right:22px;
  bottom:22px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(5,8,12,.72);
  border:5px solid rgba(255,255,255,.15);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 30px #000;
}

#speed{
  font-size:42px;
  font-weight:900;
  color:#fff;
}

.kmh{
  color:#aaa;
  font-size:12px;
}

#gear{
  margin-top:4px;
  color:#4edbff;
  font-weight:bold;
}

#mini{
  position:absolute;
  left:20px;
  bottom:20px;
  width:180px;
  height:180px;
  border-radius:16px;
  background:rgba(0,0,0,.72);
  border:2px solid rgba(255,255,255,.2);
}

#help{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:10px;
  background:rgba(0,0,0,.6);
  color:#ddd;
  font-size:12px;
}

#garage{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
}

.garage-box{
  width:min(900px,94vw);
  max-height:90vh;
  overflow:auto;
  background:#0c1118;
  border:1px solid #273443;
  border-radius:22px;
  padding:25px;
}

.garage-title{
  font-size:30px;
  font-weight:900;
  margin-bottom:20px;
  color:#fff;
}

.car-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
}

.car-card{
  background:#151d27;
  border:1px solid #293746;
  border-radius:15px;
  padding:14px;
  text-align:center;
}

.car-preview{
  height:85px;
  position:relative;
  margin-bottom:10px;
}

.fake-car{
  position:absolute;
  left:50%;
  top:35px;
  transform:translateX(-50%);
  width:120px;
  height:38px;
  border-radius:18px 22px 8px 8px;
  background:var(--car);
  box-shadow:0 8px 18px #000;
}

.fake-car:before{
  content:"";
  position:absolute;
  width:55px;
  height:24px;
  left:32px;
  top:-15px;
  border-radius:10px 12px 3px 3px;
  background:rgba(170,220,255,.7);
}

.fake-wheel{
  position:absolute;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#080808;
  bottom:-10px;
}

.fake-wheel.a{left:13px}
.fake-wheel.b{right:13px}

.car-card h3{
  color:#fff;
  margin-bottom:8px;
}

.stat{
  text-align:left;
  font-size:11px;
  color:#999;
  margin:5px 0;
}

.bar{
  height:6px;
  border-radius:5px;
  background:#29313b;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  background:#42cfff;
}

#pause{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
}

.pause-box{
  background:#10161e;
  padding:35px;
  border-radius:20px;
  text-align:center;
}

.pause-box h2{
  color:#fff;
  font-size:38px;
  margin-bottom:20px;
}

#mobile{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  pointer-events:none;
}

.touch{
  pointer-events:auto;
  position:absolute;
  width:65px;
  height:65px;
  border-radius:50%;
  background:rgba(0,0,0,.42);
  border:2px solid rgba(255,255,255,.25);
  color:#fff;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#left{left:22px;bottom:35px}
#right{left:100px;bottom:35px}
#up{right:100px;bottom:105px}
#down{right:100px;bottom:28px}
#brake{right:22px;bottom:105px}

@media(max-width:700px){
  #speedBox{
    width:110px;
    height:110px;
  }

  #speed{
    font-size:30px;
  }

  #mini{
    width:130px;
    height:130px;
  }

  #help{
    display:none;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="menu">
  <div class="menu-box">
    <div class="logo">CRAZY<span>CARS</span></div>
    <div class="subtitle">Open World Driving • Gamerex</div>

    <div class="settings">
      <label>MAP</label>
      <select id="mapSelect">
        <option value="city">Neon City</option>
        <option value="desert">Desert</option>
        <option value="forest">Forest</option>
        <option value="rain">Rain City</option>
      </select>

      <label>MODE</label>
      <select id="modeSelect">
        <option value="free">Free Roam</option>
        <option value="race">Race</option>
        <option value="time">Time Trial</option>
      </select>
    </div>

    <div class="menu-row">
      <button class="primary" onclick="startGame()">START GAME</button>
      <button onclick="openGarage()">GARAGE</button>
    </div>

    <div style="margin-top:22px;color:#777;font-size:12px">
      P1: WASD &nbsp; • &nbsp; Space: Brake &nbsp; • &nbsp; R: Reset &nbsp; • &nbsp; P: Pause
    </div>
  </div>
</div>

<div id="garage">
  <div class="garage-box">
    <div class="garage-title">🚗 GARAGE</div>

    <div class="car-grid" id="carGrid"></div>

    <div style="margin-top:20px;text-align:right">
      <button onclick="closeGarage()">BACK</button>
    </div>
  </div>
</div>

<div id="hud">
  <div class="topbar">
    <div class="badge">
      <div id="mapName">NEON CITY</div>
      <div id="modeName">FREE ROAM</div>
    </div>

    <div class="badge" id="coins">⭐ 0</div>
  </div>

  <canvas id="mini"></canvas>

  <div id="speedBox">
    <div id="speed">0</div>
    <div class="kmh">KM/H</div>
    <div id="gear">D</div>
  </div>

  <div id="help">
    WASD / ARROWS • SPACE BRAKE • R RESET • P PAUSE • ESC MENU
  </div>
</div>

<div id="mobile">
  <div class="touch" id="left">◀</div>
  <div class="touch" id="right">▶</div>
  <div class="touch" id="up">▲</div>
  <div class="touch" id="down">▼</div>
  <div class="touch" id="brake">●</div>
</div>

<div id="pause">
  <div class="pause-box">
    <h2>PAUSED</h2>
    <button class="primary" onclick="resumeGame()">RESUME</button>
    <button onclick="backToMenu()">MENU</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>
let scene;
let camera;
let renderer;
let clock;

let player;
let player2;

let running=false;
let paused=false;

let currentMap="city";
let currentMode="free";

let coins=Number(localStorage.getItem("gamerex_crazy_coins")||0);

const keys={};

let selectedCar=0;

const cars=[
  {name:"Street",color:0x20bfff,speed:1.00,acc:1.00,handling:1.00},
  {name:"Blaze",color:0xff4b3e,speed:1.15,acc:1.05,handling:.92},
  {name:"Volt",color:0xb75cff,speed:1.08,acc:1.18,handling:1.10},
  {name:"Raptor",color:0xffb300,speed:1.25,acc:.95,handling:.82},
  {name:"Phantom",color:0xdddddd,speed:1.20,acc:1.12,handling:1.02},
  {name:"Viper",color:0x20d67a,speed:1.32,acc:1.00,handling:.90},
  {name:"Rocket",color:0xff4081,speed:1.40,acc:1.15,handling:.78},
  {name:"Titan",color:0x607dff,speed:1.10,acc:.90,handling:1.20}
];

let objects=[];
let collectibles=[];
let checkpoints=[];
let ramps=[];
let train;

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x86b6d8);

  scene.fog=new THREE.Fog(0x86b6d8,180,900);

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    2500
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  document.getElementById("game").appendChild(renderer.domElement);

  clock=new THREE.Clock();

  const hemi=new THREE.HemisphereLight(0xbfe8ff,0x38452e,2.2);
  scene.add(hemi);

  const sun=new THREE.DirectionalLight(0xffffff,3);
  sun.position.set(250,400,150);
  sun.castShadow=true;
  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;
  sun.shadow.camera.left=-700;
  sun.shadow.camera.right=700;
  sun.shadow.camera.top=700;
  sun.shadow.camera.bottom=-700;
  scene.add(sun);

  createMiniMap();

  window.addEventListener("resize",resize);

  window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key===" "){
      keys.space=true;
      e.preventDefault();
    }

    if(e.key.toLowerCase()==="r") resetPlayer();

    if(e.key.toLowerCase()==="p"){
      if(running) togglePause();
    }

    if(e.key==="Escape"){
      if(running) backToMenu();
    }
  });

  window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;

    if(e.key===" ") keys.space=false;
  });

  buildGarage();

  animate();
}

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

function makeCar(data){

  const root=new THREE.Group();

  root.userData.speed=0;
  root.userData.steer=0;
  root.userData.data=data;

  const bodyMat=new THREE.MeshStandardMaterial({
    color:data.color,
    roughness:.32,
    metalness:.45
  });

  const darkMat=new THREE.MeshStandardMaterial({
    color:0x101419,
    roughness:.35,
    metalness:.25
  });

  const glassMat=new THREE.MeshStandardMaterial({
    color:0x9edcf0,
    transparent:true,
    opacity:.55,
    roughness:.1,
    metalness:.25
  });

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(2.25,.62,4.3),
    bodyMat
  );

  body.position.y=.75;
  body.castShadow=true;
  root.add(body);

  const hood=new THREE.Mesh(
    new THREE.BoxGeometry(2.05,.30,1.45),
    bodyMat
  );

  hood.position.set(0,1.06,-1.35);
  hood.castShadow=true;
  root.add(hood);

  const cabin=new THREE.Mesh(
    new THREE.BoxGeometry(1.75,.75,1.85),
    glassMat
  );

  cabin.position.set(0,1.30,.25);
  cabin.castShadow=true;
  root.add(cabin);

  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(1.82,.12,1.65),
    darkMat
  );

  roof.position.set(0,1.70,.25);
  root.add(roof);

  const bumperFront=new THREE.Mesh(
    new THREE.BoxGeometry(2.15,.20,.20),
    darkMat
  );

  bumperFront.position.set(0,.53,-2.15);
  root.add(bumperFront);

  const bumperBack=new THREE.Mesh(
    new THREE.BoxGeometry(2.15,.20,.20),
    darkMat
  );

  bumperBack.position.set(0,.53,2.15);
  root.add(bumperBack);

  const spoiler=new THREE.Mesh(
    new THREE.BoxGeometry(1.65,.10,.35),
    darkMat
  );

  spoiler.position.set(0,1.35,2.00);
  root.add(spoiler);

  const spoilerL=new THREE.Mesh(
    new THREE.BoxGeometry(.10,.35,.10),
    darkMat
  );

  spoilerL.position.set(-.62,1.18,2);
  root.add(spoilerL);

  const spoilerR=spoilerL.clone();
  spoilerR.position.x=.62;
  root.add(spoilerR);

  const wheelGeo=new THREE.CylinderGeometry(.42,.42,.30,20);
  wheelGeo.rotateZ(Math.PI/2);

  const wheelPositions=[
    [-1.08,.52,-1.45],
    [1.08,.52,-1.45],
    [-1.08,.52,1.45],
    [1.08,.52,1.45]
  ];

  root.userData.wheels=[];

  wheelPositions.forEach(pos=>{

    const w=new THREE.Mesh(
      wheelGeo,
      darkMat
    );

    w.position.set(...pos);
    w.castShadow=true;

    root.add(w);

    root.userData.wheels.push(w);

    const hub=new THREE.Mesh(
      new THREE.CylinderGeometry(.17,.17,.32,16),
      new THREE.MeshStandardMaterial({
        color:0x8c9399,
        metalness:.8,
        roughness:.2
      })
    );

    hub.rotateZ(Math.PI/2);
    hub.position.set(...pos);

    root.add(hub);
  });

  const headMat=new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:0xffffff,
    emissiveIntensity:2
  });

  [-.72,.72].forEach(x=>{
    const h=new THREE.Mesh(
      new THREE.BoxGeometry(.42,.18,.08),
      headMat
    );

    h.position.set(x,.88,-2.18);
    root.add(h);
  });

  const tailMat=new THREE.MeshStandardMaterial({
    color:0xff1515,
    emissive:0xff0000,
    emissiveIntensity:1.4
  });

  [-.72,.72].forEach(x=>{
    const h=new THREE.Mesh(
      new THREE.BoxGeometry(.42,.18,.08),
      tailMat
    );

    h.position.set(x,.88,2.18);
    root.add(h);
  });

  return root;
}

function makeGround(){

  let color=0x72a84f;

  if(currentMap==="desert") color=0xc9a263;

  if(currentMap==="forest") color=0x467344;

  if(currentMap==="rain") color=0x4e685e;

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(2400,2400),
    new THREE.MeshStandardMaterial({
      color,
      roughness:1
    })
  );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;

  scene.add(ground);
}

function makeRoad(x,z,w,d,rotation=0){

  const road=new THREE.Mesh(
    new THREE.BoxGeometry(w,.08,d),
    new THREE.MeshStandardMaterial({
      color:0x303338,
      roughness:.9
    })
  );

  road.position.set(x,.04,z);
  road.rotation.y=rotation;
  road.receiveShadow=true;

  scene.add(road);
  objects.push(road);

  const lineMat=new THREE.MeshBasicMaterial({
    color:0xf2d24b
  });

  const line=new THREE.Mesh(
    new THREE.BoxGeometry(
      rotation===0 ? .13 : w,
      .02,
      rotation===0 ? d : .13
    ),
    lineMat
  );

  line.position.set(x,.10,z);
  line.rotation.y=rotation;

  scene.add(line);
}

function makeBuilding(x,z,w,h,d,color){

  const mat=new THREE.MeshStandardMaterial({
    color,
    roughness:.72,
    metalness:.1
  });

  const b=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat
  );

  b.position.set(x,h/2,z);
  b.castShadow=true;
  b.receiveShadow=true;

  scene.add(b);
  objects.push(b);

  if(currentMap==="city"||currentMap==="rain"){

    const windowMat=new THREE.MeshBasicMaterial({
      color:0xffe7a1
    });

    for(let y=4;y<h-2;y+=6){

      for(let xx=-w/2+2;xx<w/2-1;xx+=4){

        const win=new THREE.Mesh(
          new THREE.BoxGeometry(1.4,1.2,.04),
          windowMat
        );

        win.position.set(
          x+xx,
          y,
          z-d/2-.03
        );

        scene.add(win);
      }
    }
  }
}

function makeTree(x,z){

  const group=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.35,.48,3,10),
    new THREE.MeshStandardMaterial({color:0x76502e})
  );

  trunk.position.y=1.5;
  group.add(trunk);

  const crown=new THREE.Mesh(
    new THREE.SphereGeometry(2.1,12,10),
    new THREE.MeshStandardMaterial({
      color:currentMap==="forest"?0x1d7c3c:0x3f913b
    })
  );

  crown.position.y=4;
  crown.castShadow=true;
  group.add(crown);

  group.position.set(x,0,z);

  scene.add(group);
  objects.push(group);
}

function makeRock(x,z){

  const rock=new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      .7+Math.random()*1.4,
      0
    ),
    new THREE.MeshStandardMaterial({
      color:0x77736c,
      roughness:1
    })
  );

  rock.position.set(
    x,
    .6,
    z
  );

  rock.rotation.set(
    Math.random(),
    Math.random(),
    Math.random()
  );

  rock.castShadow=true;

  scene.add(rock);
  objects.push(rock);
}

function makeCactus(x,z){

  const mat=new THREE.MeshStandardMaterial({
    color:0x2f8d43
  });

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.25,.32,3,10),
    mat
  );

  trunk.position.set(x,1.5,z);
  scene.add(trunk);

  const arm1=new THREE.Mesh(
    new THREE.CylinderGeometry(.18,.22,1.4,10),
    mat
  );

  arm1.position.set(x+0.65,1.6,z);
  arm1.rotation.z=Math.PI/2;
  scene.add(arm1);

  const arm2=arm1.clone();
  arm2.position.x=x-.65;
  scene.add(arm2);
}

function makeRamp(x,z,rotation=0){

  const ramp=new THREE.Mesh(
    new THREE.BoxGeometry(8,2,13),
    new THREE.MeshStandardMaterial({
      color:0x252a31,
      roughness:.7,
      metalness:.25
    })
  );

  ramp.position.set(x,1,z);
  ramp.rotation.set(-.18,rotation,0);

  ramp.castShadow=true;

  scene.add(ramp);
  ramps.push(ramp);
}

function makeCoin(x,z){

  const geo=new THREE.TorusGeometry(.45,.14,10,20);

  const mat=new THREE.MeshStandardMaterial({
    color:0xffd42e,
    emissive:0xffb000,
    emissiveIntensity:1.5,
    metalness:.7,
    roughness:.2
  });

  const coin=new THREE.Mesh(geo,mat);

  coin.position.set(x,1.2,z);

  coin.rotation.x=Math.PI/2;

  coin.userData.spin=Math.random()*5;

  scene.add(coin);

  collectibles.push(coin);
}

function makeCheckpoint(x,z,rotation=0){

  const group=new THREE.Group();

  const mat=new THREE.MeshStandardMaterial({
    color:0x22c9ff,
    emissive:0x008cff,
    emissiveIntensity:1.4
  });

  const left=new THREE.Mesh(
    new THREE.BoxGeometry(.35,7,.35),
    mat
  );

  left.position.x=-5;
  left.position.y=3.5;

  group.add(left);

  const right=left.clone();
  right.position.x=5;
  group.add(right);

  const top=new THREE.Mesh(
    new THREE.BoxGeometry(10,.35,.35),
    mat
  );

  top.position.y=7;
  group.add(top);

  group.position.set(x,0,z);
  group.rotation.y=rotation;

  scene.add(group);
  checkpoints.push(group);
}

function makeTrain(){

  const trainGroup=new THREE.Group();

  for(let i=0;i<7;i++){

    const wagon=new THREE.Mesh(
      new THREE.BoxGeometry(5,3,8),
      new THREE.MeshStandardMaterial({
        color:i===0?0xd63636:0x39444f,
        roughness:.6
      })
    );

    wagon.position.z=i*8.5;
    wagon.position.y=2.2;

    wagon.castShadow=true;

    trainGroup.add(wagon);
  }

  trainGroup.position.set(
    -120,
    0,
    -550
  );

  scene.add(trainGroup);

  train=trainGroup;
}

function createWorld(){

  objects.forEach(o=>scene.remove(o));
  collectibles.forEach(o=>scene.remove(o));
  checkpoints.forEach(o=>scene.remove(o));
  ramps.forEach(o=>scene.remove(o));

  objects=[];
  collectibles=[];
  checkpoints=[];
  ramps=[];

  if(train){
    scene.remove(train);
    train=null;
  }

  makeGround();

  makeRoad(0,0,35,1900);
  makeRoad(0,0,1900,35);

  makeRoad(450,0,30,1200);
  makeRoad(-450,0,30,1200);

  makeRoad(0,450,1200,30);
  makeRoad(0,-450,1200,30);

  if(currentMap==="city"||currentMap==="rain"){

    for(let x=-850;x<=850;x+=90){
      for(let z=-850;z<=850;z+=100){

        if(Math.abs(x)<80||Math.abs(z)<80) continue;

        makeBuilding(
          x,
          z,
          45+Math.random()*25,
          20+Math.random()*80,
          45+Math.random()*25,
          currentMap==="rain"
          ? 0x43515d
          : 0x39434e
        );
      }
    }
  }

  if(currentMap==="forest"){

    for(let i=0;i<260;i++){

      let x=(Math.random()-.5)*2100;
      let z=(Math.random()-.5)*2100;

      if(Math.abs(x)<260&&Math.abs(z)<260) continue;

      makeTree(x,z);
    }
  }

  if(currentMap==="desert"){

    for(let i=0;i<180;i++){

      let x=(Math.random()-.5)*2100;
      let z=(Math.random()-.5)*2100;

      if(Math.abs(x)<250&&Math.abs(z)<250) continue;

      if(Math.random()<.45) makeCactus(x,z);
      else makeRock(x,z);
    }
  }

  if(currentMap==="city"||currentMap==="rain"){

    for(let i=0;i<80;i++){

      let x=(Math.random()-.5)*1700;
      let z=(Math.random()-.5)*1700;

      if(Math.abs(x)<300&&Math.abs(z)<300) continue;

      makeRock(x,z);
    }
  }

  const rampPositions=[
    [80,-120],
    [-100,150],
    [520,-230],
    [-520,220],
    [250,520],
    [-250,-520]
  ];

  rampPositions.forEach((p,i)=>{
    makeRamp(p[0],p[1],i%2?Math.PI/2:0);
  });

  for(let i=0;i<35;i++){

    const angle=Math.random()*Math.PI*2;
    const radius=100+Math.random()*850;

    makeCoin(
      Math.cos(angle)*radius,
      Math.sin(angle)*radius
    );
  }

  const cp=[
    [0,-650],
    [650,-450],
    [650,450],
    [0,650],
    [-650,450],
    [-650,-450]
  ];

  cp.forEach((p,i)=>{
    makeCheckpoint(
      p[0],
      p[1],
      i%2?Math.PI/2:0
    );
  });

  makeTrain();
}

function startGame(){

  currentMap=document.getElementById("mapSelect").value;
  currentMode=document.getElementById("modeSelect").value;

  document.getElementById("menu").style.display="none";
  document.getElementById("garage").style.display="none";
  document.getElementById("hud").style.display="block";

  document.getElementById("mapName").textContent=
    currentMap.toUpperCase()+" • MAP";

  document.getElementById("modeName").textContent=
    currentMode.toUpperCase().replace("FREE","FREE ROAM");

  createWorld();

  if(player) scene.remove(player);
  if(player2) scene.remove(player2);

  player=makeCar(cars[selectedCar]);

  player.position.set(0,.1,0);
  player.rotation.y=Math.PI;

  scene.add(player);

  player2=makeCar({
    ...cars[(selectedCar+1)%cars.length]
  });

  player2.scale.setScalar(.92);
  player2.position.set(7,.1,0);
  player2.rotation.y=Math.PI;

  scene.add(player2);

  camera.position.set(0,8,16);
  camera.lookAt(player.position);

  running=true;
  paused=false;

  document.getElementById("pause").style.display="none";

  if("ontouchstart" in window){
    document.getElementById("mobile").style.display="block";
  }
}

function resetPlayer(){

  if(!player) return;

  player.position.set(0,.1,0);
  player.rotation.set(0,Math.PI,0);
  player.userData.speed=0;
}

function updateCar(car,controls,dt){

  if(!car) return;

  const data=car.userData.data;

  let throttle=0;
  let steer=0;

  if(controls==="p1"){

    if(keys.w) throttle+=1;
    if(keys.s) throttle-=.7;

    if(keys.a) steer-=1;
    if(keys.d) steer+=1;

  }else{

    if(keys.arrowup) throttle+=1;
    if(keys.arrowdown) throttle-=.7;

    if(keys.arrowleft) steer-=1;
    if(keys.arrowright) steer+=1;
  }

  const brake=keys.space;

  let maxSpeed=1.15*data.speed;

  if(brake){
    car.userData.speed*=Math.pow(.86,dt*60);
  }

  if(throttle>0){
    car.userData.speed+=
      .020*data.acc*throttle*dt*60;
  }

  if(throttle<0){
    car.userData.speed+=
      .014*throttle*dt*60;
  }

  car.userData.speed*=Math.pow(.992,dt*60);

  car.userData.speed=
    THREE.MathUtils.clamp(
      car.userData.speed,
      -0.45,
      maxSpeed
    );

  const steerPower=
    .025*data.handling*
    Math.min(Math.abs(car.userData.speed)*1.7,1.2);

  car.rotation.y-=steer*steerPower*dt*60;

  const forward=new THREE.Vector3(
    Math.sin(car.rotation.y),
    0,
    Math.cos(car.rotation.y)
  );

  car.position.addScaledVector(
    forward,
    car.userData.speed*dt*60
  );

  car.position.x=
    THREE.MathUtils.clamp(car.position.x,-1120,1120);

  car.position.z=
    THREE.MathUtils.clamp(car.position.z,-1120,1120);

  car.position.y=.1;

  car.userData.wheels.forEach(w=>{
    w.rotation.x-=car.userData.speed*dt*15;
  });

  car.rotation.z=
    THREE.MathUtils.lerp(
      car.rotation.z,
      -steer*.08*Math.abs(car.userData.speed),
      .12
    );
}

function updateCamera(dt){

  const forward=new THREE.Vector3(
    Math.sin(player.rotation.y),
    0,
    Math.cos(player.rotation.y)
  );

  const target=player.position.clone();

  const desired=player.position.clone()
    .addScaledVector(forward,-11);

  desired.y+=5.8;

  camera.position.lerp(
    desired,
    1-Math.pow(.001,dt)
  );

  target.y+=1;

  camera.lookAt(target);
}

function collectCoins(){

  for(let i=collectibles.length-1;i>=0;i--){

    const c=collectibles[i];

    c.rotation.y+=.05;

    if(player.position.distanceTo(c.position)<3){

      scene.remove(c);
      collectibles.splice(i,1);

      coins++;
      localStorage.setItem(
        "gamerex_crazy_coins",
        coins
      );

      updateCoins();
    }
  }
}

function updateTrain(dt){

  if(!train) return;

  train.position.x+=dt*18;

  if(train.position.x>900){
    train.position.x=-900;
  }
}

function updateCoins(){
  document.getElementById("coins").textContent=
    "⭐ "+coins;
}

function updateHUD(){

  if(!player) return;

  const kmh=Math.round(
    Math.abs(player.userData.speed)*95
  );

  document.getElementById("speed").textContent=kmh;

  document.getElementById("gear").textContent=
    player.userData.speed<-.05?"R":"D";

  updateMini();
}

function createMiniMap(){

  const c=document.getElementById("mini");

  c.width=360;
  c.height=360;
}

function updateMini(){

  if(!player) return;

  const c=document.getElementById("mini");
  const ctx=c.getContext("2d");

  ctx.clearRect(0,0,360,360);

  ctx.fillStyle="#111820";
  ctx.fillRect(0,0,360,360);

  const scale=.145;

  ctx.save();
  ctx.translate(180,180);

  ctx.strokeStyle="#444d57";
  ctx.lineWidth=10;

  ctx.beginPath();
  ctx.moveTo(0,-170);
  ctx.lineTo(0,170);
  ctx.moveTo(-170,0);
  ctx.lineTo(170,0);
  ctx.stroke();

  ctx.fillStyle="#28c9ff";

  checkpoints.forEach(cp=>{

    const x=cp.position.x*scale;
    const y=cp.position.z*scale;

    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fill();
  });

  collectibles.forEach(c=>{

    const x=c.position.x*scale;
    const y=c.position.z*scale;

    ctx.fillStyle="#ffd22e";
    ctx.beginPath();
    ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fill();
  });

  const px=player.position.x*scale;
  const py=player.position.z*scale;

  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(-player.rotation.y);

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.moveTo(0,-8);
  ctx.lineTo(5,7);
  ctx.lineTo(-5,7);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  ctx.restore();
}

function buildGarage(){

  const grid=document.getElementById("carGrid");
  grid.innerHTML="";

  cars.forEach((car,index)=>{

    const card=document.createElement("div");
    card.className="car-card";

    card.innerHTML=`
      <div class="car-preview">
        <div class="fake-car" style="--car:#${car.color.toString(16).padStart(6,"0")}">
          <div class="fake-wheel a"></div>
          <div class="fake-wheel b"></div>
        </div>
      </div>

      <h3>${car.name}</h3>

      <div class="stat">Speed</div>
      <div class="bar"><i style="width:${Math.min(car.speed/1.4*100,100)}%"></i></div>

      <div class="stat">Acceleration</div>
      <div class="bar"><i style="width:${Math.min(car.acc/1.18*100,100)}%"></i></div>

      <div class="stat">Handling</div>
      <div class="bar"><i style="width:${Math.min(car.handling/1.2*100,100)}%"></i></div>

      <button style="margin-top:12px;width:100%"
        onclick="selectCar(${index})">
        SELECT
      </button>
    `;

    grid.appendChild(card);
  });
}

function selectCar(index){

  selectedCar=index;

  document.getElementById("garage").style.display="none";
  document.getElementById("menu").style.display="flex";
}

function openGarage(){
  document.getElementById("garage").style.display="flex";
  document.getElementById("menu").style.display="none";
}

function closeGarage(){
  document.getElementById("garage").style.display="none";
  document.getElementById("menu").style.display="flex";
}

function togglePause(){

  if(!running) return;

  paused=!paused;

  document.getElementById("pause").style.display=
    paused?"flex":"none";
}

function resumeGame(){
  paused=false;
  document.getElementById("pause").style.display="none";
}

function backToMenu(){

  running=false;
  paused=false;

  document.getElementById("pause").style.display="none";
  document.getElementById("hud").style.display="none";
  document.getElementById("mobile").style.display="none";
  document.getElementById("menu").style.display="flex";
}

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.04);

  if(running&&!paused){

    updateCar(player,"p1",dt);
    updateCar(player2,"p2",dt);

    collectCoins();
    updateTrain(dt);
    updateCamera(dt);
    updateHUD();

    if(currentMap==="rain"){
      scene.fog.color.set(0x596a70);
      scene.fog.near=80;
      scene.fog.far=650;
      scene.background.set(0x596a70);
    }

  }

  renderer.render(scene,camera);
}

  e.preventDefault();

});
document.getElementById("left").addEventListener("touchend",e=>{

document.getElementById("right").addEventListener("touchstart",e=>{

document.getElementById("right").addEventListener("touchend",e=>{
  e.preventDefault();
  keys.d=false;
});

document.getElementById("up").addEventListener("touchstart",e=>{
  e.preventDefault();
  keys.w=true;
});
document.getElementById("up").addEventListener("touchend",e=>{
  e.preventDefault();
  keys.w=false;
});

document.getElementById("down").addEventListener("touchstart",e=>{
  e.preventDefault();
  keys.s=true;
});
document.getElementById("down").addEventListener("touchend",e=>{
  e.preventDefault();
  keys.s=false;
});

document.getElementById("brake").addEventListener("touchstart",e=>{
  e.preventDefault();
  keys.space=true;
});
document.getElementById("brake").addEventListener("touchend",e=>{
  e.preventDefault();
  keys.space=false;
});

updateCoins();
init();
</script>
