<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GamerEx - Crazy Cars</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#79bde8;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,rgba(40,80,120,.15),rgba(0,0,0,.72)),
        linear-gradient(180deg,#17202b,#05070a);
    color:white;
}

.menuBox{
    width:min(900px,94vw);
    max-height:94vh;
    overflow:auto;
    padding:28px;
    border-radius:24px;
    background:rgba(12,16,22,.92);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.logo{
    text-align:center;
    font-size:clamp(42px,8vw,78px);
    font-weight:1000;
    letter-spacing:5px;
    font-style:italic;
    text-shadow:0 5px 0 #111,0 0 30px rgba(0,190,255,.35);
}

.logo span{
    color:#00c8ff;
}

.subtitle{
    text-align:center;
    color:#aeb9c6;
    margin:4px 0 24px;
    font-size:14px;
    letter-spacing:2px;
}

.sectionTitle{
    color:#00c8ff;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    margin:18px 0 9px;
}

.options{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.option{
    flex:1;
    min-width:120px;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid #303945;
    background:#171d25;
    color:#dce5ed;
    cursor:pointer;
    text-align:center;
    transition:.15s;
}

.option:hover{
    background:#202a35;
}

.option.active{
    border-color:#00c8ff;
    background:#063747;
    color:white;
    box-shadow:0 0 18px rgba(0,200,255,.15);
}

.cars{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.carChoice{
    padding:10px 5px;
    border-radius:12px;
    background:#171d25;
    border:1px solid #303945;
    cursor:pointer;
    text-align:center;
}

.carChoice.active{
    border-color:#00c8ff;
    background:#063747;
}

.carPreview{
    width:62px;
    height:30px;
    margin:0 auto 7px;
    border-radius:9px 13px 7px 7px;
    position:relative;
    box-shadow:inset 0 -5px rgba(0,0,0,.25);
}

.carPreview:before,
.carPreview:after{
    content:"";
    position:absolute;
    bottom:-5px;
    width:13px;
    height:9px;
    background:#080a0d;
    border-radius:3px;
}

.carPreview:before{left:7px}
.carPreview:after{right:7px}

.carName{
    font-size:11px;
    color:#cbd5df;
}

.start{
    width:100%;
    margin-top:24px;
    padding:17px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#00c8ff,#087bd7);
    color:white;
    font-size:18px;
    font-weight:900;
    letter-spacing:2px;
    cursor:pointer;
    box-shadow:0 12px 35px rgba(0,150,255,.25);
}

.start:hover{
    filter:brightness(1.12);
    transform:translateY(-1px);
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    color:white;
    display:none;
}

.topLeft{
    position:absolute;
    top:16px;
    left:16px;
    padding:10px 13px;
    border-radius:12px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(7px);
    font-size:13px;
}

.topRight{
    position:absolute;
    top:16px;
    right:16px;
    display:flex;
    gap:8px;
    align-items:center;
}

.hudBox{
    padding:10px 13px;
    border-radius:12px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(7px);
    font-size:13px;
}

.pauseBtn{
    pointer-events:auto;
    border:0;
    color:white;
    background:rgba(0,0,0,.55);
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.speed{
    position:absolute;
    right:20px;
    bottom:18px;
    text-align:right;
    text-shadow:0 3px 10px #000;
}

.speedNumber{
    font-size:48px;
    font-weight:1000;
    font-style:italic;
}

.speedUnit{
    color:#b9c8d5;
    font-size:12px;
}

.centerMessage{
    position:absolute;
    left:50%;
    top:17%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:900;
    text-shadow:0 3px 15px #000;
    opacity:0;
    transition:.2s;
}

#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;
}

.touch{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.32);
    color:white;
    font-size:25px;
    pointer-events:auto;
    touch-action:none;
}

#leftBtn{left:20px;bottom:25px}
#rightBtn{left:100px;bottom:25px}
#gasBtn{right:20px;bottom:105px}
#brakeBtn{right:20px;bottom:25px}

#pauseOverlay{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.62);
    color:white;
}

.pauseBox{
    width:min(360px,90vw);
    padding:30px;
    border-radius:20px;
    background:#10151c;
    text-align:center;
    border:1px solid #303945;
}

.pauseBox h2{
    margin-bottom:20px;
}

.pauseBox button{
    width:100%;
    padding:13px;
    margin-top:9px;
    border:0;
    border-radius:11px;
    background:#202b36;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.pauseBox button.primary{
    background:#00a9dc;
}

@media(max-width:650px){
    .menuBox{
        padding:20px;
    }

    .cars{
        grid-template-columns:repeat(3,1fr);
    }

    #mobileControls{
        display:block;
    }

    .speedNumber{
        font-size:35px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
    <div class="menuBox">
        <div class="logo">CRAZY <span>CARS</span></div>
        <div class="subtitle">GAMEREX OPEN WORLD RACING</div>

        <div class="sectionTitle">PLAYERS</div>
        <div class="options" id="playersOptions">
            <div class="option active" data-value="1">1 PLAYER</div>
            <div class="option" data-value="2">2 PLAYERS</div>
        </div>

        <div class="sectionTitle">WORLD</div>
        <div class="options" id="worldOptions">
            <div class="option active" data-value="city">MEGA CITY</div>
            <div class="option" data-value="desert">DESERT</div>
            <div class="option" data-value="forest">FOREST</div>
            <div class="option" data-value="stunt">STUNT ZONE</div>
        </div>

        <div class="sectionTitle">MODE</div>
        <div class="options" id="modeOptions">
            <div class="option active" data-value="free">FREE WORLD</div>
            <div class="option" data-value="race">RACE</div>
            <div class="option" data-value="time">TIME TRIAL</div>
        </div>

        <div class="sectionTitle">CHOOSE YOUR CAR</div>
        <div class="cars" id="carOptions"></div>

        <button class="start" id="startGame">START GAME</button>
    </div>
</div>

<div id="hud">
    <div class="topLeft">
        <b id="worldText">MEGA CITY</b>
        <br>
        <span id="modeText">FREE WORLD</span>
    </div>

    <div class="topRight">
        <div class="hudBox">🪙 <span id="coins">0</span></div>
        <div class="hudBox">🏁 <span id="checkpoint">0</span></div>
        <button class="pauseBtn" id="pauseButton">Ⅱ</button>
    </div>

    <div class="centerMessage" id="centerMessage"></div>

    <div class="speed">
        <div class="speedNumber" id="speed">0</div>
        <div class="speedUnit">KM/H</div>
    </div>
</div>

<div id="mobileControls">
    <button class="touch" id="leftBtn">◀</button>
    <button class="touch" id="rightBtn">▶</button>
    <button class="touch" id="gasBtn">▲</button>
    <button class="touch" id="brakeBtn">▼</button>
</div>

<div id="pauseOverlay">
    <div class="pauseBox">
        <h2>GAME PAUSED</h2>
        <button class="primary" id="resumeBtn">RESUME</button>
        <button id="menuBtn">MAIN MENU</button>
    </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let dpr=Math.min(devicePixelRatio||1,2);

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W*dpr;
    canvas.height=H*dpr;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

const cars=[
    {name:"Falcon",color:"#e31b23",accent:"#7d080e",speed:8.2,accel:.18,handling:.055},
    {name:"Viper",color:"#16a085",accent:"#075d4e",speed:8.7,accel:.17,handling:.060},
    {name:"Storm",color:"#2779c9",accent:"#123e69",speed:9.0,accel:.19,handling:.058},
    {name:"Phantom",color:"#7736a0",accent:"#35154d",speed:8.8,accel:.18,handling:.062},
    {name:"Raptor",color:"#e98c09",accent:"#754500",speed:9.2,accel:.20,handling:.052},
    {name:"Blaze",color:"#ed4a1b",accent:"#7a1d09",speed:9.4,accel:.21,handling:.050},
    {name:"Shadow",color:"#30363d",accent:"#050608",speed:9.0,accel:.18,handling:.065},
    {name:"Volt",color:"#00b6d0",accent:"#00515d",speed:9.7,accel:.20,handling:.060},
    {name:"Titan",color:"#687b87",accent:"#2f414b",speed:8.0,accel:.25,handling:.045},
    {name:"Turbo",color:"#d92c6b",accent:"#721338",speed:10.0,accel:.19,handling:.057},
    {name:"Nitro",color:"#d6a900",accent:"#725900",speed:10.3,accel:.22,handling:.055},
    {name:"Comet",color:"#9144a9",accent:"#4a2258",speed:9.6,accel:.23,handling:.065},
    {name:"Bullet",color:"#d9dde0",accent:"#737b80",speed:10.5,accel:.20,handling:.052},
    {name:"Apex",color:"#20a957",accent:"#0b592c",speed:9.8,accel:.24,handling:.063},
    {name:"Inferno",color:"#e5163f",accent:"#690a1c",speed:10.8,accel:.22,handling:.050}
];

const carOptions=document.getElementById("carOptions");

cars.forEach((car,i)=>{
    const el=document.createElement("div");
    el.className="carChoice"+(i===0?" active":"");
    el.dataset.index=i;

    el.innerHTML=`
        <div class="carPreview" style="background:${car.color}"></div>
        <div class="carName">${car.name}</div>
    `;

    el.onclick=()=>{
        document.querySelectorAll(".carChoice").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        selectedCar=i;
    };

    carOptions.appendChild(el);
});

let selectedCar=0;
let players=1;
let worldType="city";
let mode="free";

function optionGroup(id,callback){
    document.querySelectorAll("#"+id+" .option").forEach(el=>{
        el.onclick=()=>{
            document.querySelectorAll("#"+id+" .option")
                .forEach(x=>x.classList.remove("active"));

            el.classList.add("active");
            callback(el.dataset.value);
        };
    });
}

optionGroup("playersOptions",v=>players=Number(v));
optionGroup("worldOptions",v=>worldType=v);
optionGroup("modeOptions",v=>mode=v);

let gameRunning=false;
let paused=false;
let lastTime=0;

let coins=Number(localStorage.getItem("gamerex_coins")||0);

let keys={};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key==="Escape"){
        showMenu();
    }

    if(e.key.toLowerCase()==="p"){
        togglePause();
    }

    if(e.key.toLowerCase()==="r"){
        resetCars();
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function touchControl(id,key){
    const el=document.getElementById(id);

    const down=e=>{
        e.preventDefault();
        keys[key]=true;
    };

    const up=e=>{
        e.preventDefault();
        keys[key]=false;
    };

    el.addEventListener("pointerdown",down);
    el.addEventListener("pointerup",up);
    el.addEventListener("pointercancel",up);
    el.addEventListener("pointerleave",up);
}

touchControl("leftBtn","a");
touchControl("rightBtn","d");
touchControl("gasBtn","w");
touchControl("brakeBtn","s");

document.getElementById("pauseButton").onclick=togglePause;
document.getElementById("resumeBtn").onclick=togglePause;
document.getElementById("menuBtn").onclick=showMenu;

document.getElementById("startGame").onclick=startGame;

function showMenu(){
    gameRunning=false;
    paused=false;
    document.getElementById("menu").style.display="flex";
    document.getElementById("hud").style.display="none";
    document.getElementById("pauseOverlay").style.display="none";
}

function togglePause(){
    if(!gameRunning)return;

    paused=!paused;

    document.getElementById("pauseOverlay").style.display=
        paused?"flex":"none";
}

let roadSegments=[];
let buildings=[];
let trees=[];
let rocks=[];
let ramps=[];
let pickups=[];
let checkpoints=[];
let particles=[];

function rand(a,b){
    return a+Math.random()*(b-a);
}

function makeWorld(){

    roadSegments=[];
    buildings=[];
    trees=[];
    rocks=[];
    ramps=[];
    pickups=[];
    checkpoints=[];
    particles=[];

    const grid=worldType==="city";
    const desert=worldType==="desert";
    const forest=worldType==="forest";
    const stunt=worldType==="stunt";

    if(grid){

        const spacing=520;

        for(let x=-2600;x<=2600;x+=spacing){
            roadSegments.push({
                type:"v",
                x,
                z:0,
                w:150,
                l:6000
            });
        }

        for(let z=-2600;z<=2600;z+=spacing){
            roadSegments.push({
                type:"h",
                x:0,
                z,
                w:150,
                l:6000
            });
        }

        for(let x=-2400;x<=2400;x+=260){
            for(let z=-2400;z<=2400;z+=260){

                const nearRoad=
                    Math.abs(((x+2600)%520)-260)<125 ||
                    Math.abs(((z+2600)%520)-260)<125;

                if(!nearRoad){
                    buildings.push({
                        x:x+rand(-45,45),
                        z:z+rand(-45,45),
                        w:rand(90,170),
                        d:rand(90,170),
                        h:rand(80,260)
                    });
                }
            }
        }
    }

    if(desert){

        roadSegments.push({
            type:"h",
            x:0,
            z:0,
            w:190,
            l:7000
        });

        roadSegments.push({
            type:"v",
            x:0,
            z:0,
            w:190,
            l:7000
        });

        for(let i=0;i<100;i++){
            rocks.push({
                x:rand(-3000,3000),
                z:rand(-3000,3000),
                r:rand(10,45)
            });
        }

        for(let i=0;i<35;i++){
            ramps.push({
                x:rand(-2200,2200),
                z:rand(-2200,2200),
                angle:rand(0,Math.PI*2)
            });
        }
    }

    if(forest){

        roadSegments.push({
            type:"h",
            x:0,
            z:0,
            w:180,
            l:7000
        });

        roadSegments.push({
            type:"v",
            x:0,
            z:0,
            w:180,
            l:7000
        });

        for(let i=0;i<240;i++){
            const x=rand(-3000,3000);
            const z=rand(-3000,3000);

            if(Math.abs(x)<130 || Math.abs(z)<130)continue;

            trees.push({
                x,
                z,
                r:rand(18,32),
                h:rand(80,150)
            });
        }
    }

    if(stunt){

        for(let i=0;i<7;i++){

            roadSegments.push({
                type:"h",
                x:0,
                z:-1800+i*600,
                w:210,
                l:5000
            });

            ramps.push({
                x:rand(-1500,1500),
                z:-1800+i*600+rand(-60,60),
                angle:0
            });
        }

        for(let i=0;i<45;i++){
            ramps.push({
                x:rand(-2400,2400),
                z:rand(-2300,2300),
                angle:rand(0,Math.PI*2)
            });
        }
    }

    for(let i=0;i<55;i++){

        pickups.push({
            x:rand(-2400,2400),
            z:rand(-2400,2400),
            collected:false,
            spin:rand(0,Math.PI*2)
        });
    }

    for(let i=0;i<12;i++){

        checkpoints.push({
            x:rand(-2200,2200),
            z:rand(-2200,2200),
            hit:false
        });
    }
}

function createCar(index,x,z){

    return {
        x,
        z,
        angle:0,
        speed:0,
        color:cars[index].color,
        accent:cars[index].accent,
        stats:cars[index],

        camX:x,
        camZ:z-340,
        camAngle:0,
        camHeight:110,
        camLookX:x,
        camLookZ:z+100,

        coins:0,
        checkpoint:0,
        lap:0,

        wheelTurn:0
    };
}

let car1;
let car2;

function startGame(){

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="block";

    document.getElementById("worldText").textContent=
        worldType.toUpperCase().replace("STUNT","STUNT ZONE");

    document.getElementById("modeText").textContent=
        mode==="free"?"FREE WORLD":
        mode==="race"?"RACE":"TIME TRIAL";

    makeWorld();

    car1=createCar(
        selectedCar,
        0,
        0
    );

    if(players===2){
        car2=createCar(
            (selectedCar+1)%cars.length,
            45,
            0
        );
        car2.angle=0;
    }else{
        car2=null;
    }

    gameRunning=true;
    paused=false;

    lastTime=performance.now();
}

function resetCars(){

    if(!car1)return;

    car1.x=0;
    car1.z=0;
    car1.speed=0;
    car1.angle=0;
    car1.camX=0;
    car1.camZ=-340;

    if(car2){
        car2.x=45;
        car2.z=0;
        car2.speed=0;
        car2.angle=0;
        car2.camX=45;
        car2.camZ=-340;
    }
}

function inputFor(car,n){

    if(n===1){

        return {
            gas:keys["w"]||keys["arrowup"],
            brake:keys["s"]||keys["arrowdown"],
            left:keys["a"]||keys["arrowleft"],
            right:keys["d"]||keys["arrowright"]
        };

    }else{

        return {
            gas:keys["arrowup"],
            brake:keys["arrowdown"],
            left:keys["arrowleft"],
            right:keys["arrowright"]
        };
    }
}

function updateCar(car,dt,n){

    const input=inputFor(car,n);
    const stats=car.stats;

    if(input.gas){

        car.speed+=stats.accel*dt*60;

    }else if(input.brake){

        car.speed-=.28*dt*60;

    }else{

        car.speed*=Math.pow(.985,dt*60);
    }

    if(car.speed>stats.speed)car.speed=stats.speed;
    if(car.speed<-stats.speed*.45)car.speed=-stats.speed*.45;

    const steer=
        (input.right?1:0)-
        (input.left?1:0);

    const speedRatio=
        Math.min(1,Math.abs(car.speed)/(stats.speed||10));

    if(Math.abs(car.speed)>.15){

        const direction=car.speed>=0?1:-1;

        car.angle+=
            steer*
            stats.handling*
            (0.35+speedRatio*.9)*
            direction*
            dt*60;
    }

    car.wheelTurn+=(steer-car.wheelTurn)*Math.min(1,dt*12);

    car.x+=Math.sin(car.angle)*car.speed*dt*60;
    car.z+=Math.cos(car.angle)*car.speed*dt*60;

    const limit=3200;

    if(car.x>limit)car.x=-limit;
    if(car.x<-limit)car.x=limit;
    if(car.z>limit)car.z=-limit;
    if(car.z<-limit)car.z=limit;

    checkPickups(car);
    checkCheckpoints(car);
    checkRamps(car);
}

function checkPickups(car){

    for(const p of pickups){

        if(p.collected)continue;

        const dx=p.x-car.x;
        const dz=p.z-car.z;

        if(dx*dx+dz*dz<85*85){

            p.collected=true;
            car.coins++;

            coins++;
            localStorage.setItem("gamerex_coins",coins);

            burst(p.x,p.z,"coin");

            showMessage("+1 COIN");
        }
    }
}

function checkCheckpoints(car){

    for(const c of checkpoints){

        if(c.hit)continue;

        const dx=c.x-car.x;
        const dz=c.z-car.z;

        if(dx*dx+dz*dz<130*130){

            c.hit=true;
            car.checkpoint++;

            burst(c.x,c.z,"checkpoint");

            showMessage(
                "CHECKPOINT "+car.checkpoint
            );
        }
    }
}

function checkRamps(car){

    for(const r of ramps){

        const dx=r.x-car.x;
        const dz=r.z-car.z;

        if(dx*dx+dz*dz<80*80 &&
           Math.abs(car.speed)>5){

            car.speed+=.8;

            burst(
                car.x,
                car.z,
                "boost"
            );
        }
    }
}

let messageTimer=0;

function showMessage(text){

    const el=document.getElementById("centerMessage");

    el.textContent=text;
    el.style.opacity="1";

    messageTimer=1.2;
}

function updateCamera(car,dt){

    const stats=car.stats;

    const speedRatio=
        Math.min(
            1,
            Math.abs(car.speed)/(stats.speed||10.8)
        );

    /*
       Third-person chase camera:
       - behind car
       - slightly above
       - farther away at high speed
       - looks ahead instead of directly at car
    */

    const distance=
        300+
        speedRatio*105;

    const height=
        105+
        speedRatio*45;

    const lookAhead=
        90+
        speedRatio*120;

    const sideOffset=
        car.wheelTurn*
        speedRatio*
        45;

    const targetX=
        car.x-
        Math.sin(car.angle)*distance+
        Math.cos(car.angle)*sideOffset;

    const targetZ=
        car.z-
        Math.cos(car.angle)*distance-
        Math.sin(car.angle)*sideOffset;

    const lookX=
        car.x+
        Math.sin(car.angle)*lookAhead;

    const lookZ=
        car.z+
        Math.cos(car.angle)*lookAhead;

    const positionSmooth=
        1-Math.pow(.00008,dt);

    const cameraSmooth=
        1-Math.pow(.00002,dt);

    car.camX+=
        (targetX-car.camX)*
        positionSmooth;

    car.camZ+=
        (targetZ-car.camZ)*
        positionSmooth;

    car.camHeight+=
        (height-car.camHeight)*
        cameraSmooth;

    car.camLookX+=
        (lookX-car.camLookX)*
        cameraSmooth;

    car.camLookZ+=
        (lookZ-car.camLookZ)*
        cameraSmooth;

    let targetAngle=
        Math.atan2(
            car.camLookX-car.camX,
            car.camLookZ-car.camZ
        );

    let diff=
        targetAngle-car.camAngle;

    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;

    car.camAngle+=
        diff*
        Math.min(1,dt*8);

    return {
        x:car.camX,
        z:car.camZ,
        angle:car.camAngle,
        height:car.camHeight,
        pitch:.08+speedRatio*.025
    };
}

function project(wx,wz,cam){

    const dx=wx-cam.x;
    const dz=wz-cam.z;

    const sin=Math.sin(-cam.angle);
    const cos=Math.cos(-cam.angle);

    const x=
        dx*cos-
        dz*sin;

    const forward=
        dx*sin+
        dz*cos;

    const depth=
        forward+950;

    if(depth<=18)return null;

    const scale=
        760/depth;

    /*
       Camera height affects horizon,
       keeping the car lower and the road visible.
    */

    const horizon=
        H*.405+
        (cam.height-105)*.055;

    const vertical=
        -forward*.52;

    return {
        x:W/2+x*scale,
        y:horizon+vertical*scale,
        scale,
        depth
    };
}

function drawWorld(cam){

    drawSky(cam);
    drawGround(cam);

    const objects=[];

    for(const b of buildings)objects.push({
        type:"building",
        obj:b,
        depth:distanceDepth(b.x,b.z,cam)
    });

    for(const t of trees)objects.push({
        type:"tree",
        obj:t,
        depth:distanceDepth(t.x,t.z,cam)
    });

    for(const r of rocks)objects.push({
        type:"rock",
        obj:r,
        depth:distanceDepth(r.x,r.z,cam)
    });

    for(const r of ramps)objects.push({
        type:"ramp",
        obj:r,
        depth:distanceDepth(r.x,r.z,cam)
    });

    for(const p of pickups){
        if(!p.collected)objects.push({
            type:"coin",
            obj:p,
            depth:distanceDepth(p.x,p.z,cam)
        });
    }

    for(const c of checkpoints){
        if(!c.hit)objects.push({
            type:"checkpoint",
            obj:c,
            depth:distanceDepth(c.x,c.z,cam)
        });
    }

    objects.sort((a,b)=>b.depth-a.depth);

    for(const item of objects){

        if(item.type==="building")
            drawBuilding(item.obj,cam);

        if(item.type==="tree")
            drawTree(item.obj,cam);

        if(item.type==="rock")
            drawRock(item.obj,cam);

        if(item.type==="ramp")
            drawRamp(item.obj,cam);

        if(item.type==="coin")
            drawCoin(item.obj,cam);

        if(item.type==="checkpoint")
            drawCheckpoint(item.obj,cam);
    }

    drawRoads(cam);
}

function distanceDepth(x,z,cam){

    const dx=x-cam.x;
    const dz=z-cam.z;

    const sin=Math.sin(-cam.angle);
    const cos=Math.cos(-cam.angle);

    const y=dx*sin+dz*cos;

    return y;
}

function drawSky(cam){

    const g=ctx.createLinearGradient(0,0,0,H);

    if(worldType==="desert"){
        g.addColorStop(0,"#68b7ed");
        g.addColorStop(1,"#e9bf72");
    }else if(worldType==="forest"){
        g.addColorStop(0,"#72c8ed");
        g.addColorStop(1,"#a8d6a0");
    }else{
        g.addColorStop(0,"#62b9e9");
        g.addColorStop(1,"#d6ecf4");
    }

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="rgba(255,255,255,.7)";

    for(let i=0;i<8;i++){

        const x=(i*317+120)%W;
        const y=55+(i*61)%150;

        ctx.beginPath();
        ctx.ellipse(x,y,45,13,0,0,Math.PI*2);
        ctx.fill();
    }

    ctx.fillStyle="rgba(255,255,255,.22)";
    ctx.fillRect(0,H*.38,W,H*.05);
}

function drawGround(cam){

    ctx.fillStyle=
        worldType==="desert"?"#d8ae67":
        worldType==="forest"?"#5d9b52":
        worldType==="stunt"?"#5b6269":
        "#4e8f55";

    ctx.fillRect(0,H*.43,W,H*.57);

    /*
       Ground perspective stripes
    */

    for(let i=0;i<22;i++){

        const y=
            H*.43+
            Math.pow(i/22,1.8)*
            H*.57;

        ctx.fillStyle=
            i%2===0?
            "rgba(255,255,255,.025)":
            "rgba(0,0,0,.025)";

        ctx.fillRect(0,y,W,Math.max(1,H*.02));
    }
}

function drawRoads(cam){

    for(const r of roadSegments){

        if(r.type==="h"){

            const z=r.z;
            const left=project(r.x-r.l/2,z,cam);
            const right=project(r.x+r.l/2,z,cam);

            if(!left&&!right)continue;

            const center=project(r.x,z,cam);

            if(!center)continue;

            const width=project(
                r.x+r.w,
                z,
                cam
            );

            const halfWidth=
                width?
                Math.abs(width.x-center.x):
                20;

            ctx.fillStyle="#333940";

            ctx.beginPath();
            ctx.moveTo(
                W/2-halfWidth,
                center.y
            );
            ctx.lineTo(
                W/2+halfWidth,
                center.y
            );

            const far=project(
                r.x,
                z+5000,
                cam
            );

            if(far){

                const fw=project(
                    r.x+r.w,
                    z+5000,
                    cam
                );

                const farHalf=
                    fw?
                    Math.abs(fw.x-far.x):
                    2;

                ctx.lineTo(
                    far.x+farHalf,
                    far.y
                );

                ctx.lineTo(
                    far.x-farHalf,
                    far.y
                );
            }else{

                ctx.lineTo(
                    W/2+halfWidth,
                    0
                );

                ctx.lineTo(
                    W/2-halfWidth,
                    0
                );
            }

            ctx.closePath();
            ctx.fill();

            drawRoadLines(
                r.x,
                z,
                r.w,
                cam,
                "h"
            );
        }

        if(r.type==="v"){

            const x=r.x;
            const center=project(x,r.z,cam);

            if(!center)continue;

            const widthPoint=
                project(
                    x+r.w,
                    r.z,
                    cam
                );

            const halfWidth=
                widthPoint?
                Math.abs(widthPoint.x-center.x):
                20;

            ctx.fillStyle="#333940";

            ctx.beginPath();
            ctx.moveTo(
                center.x-halfWidth,
                center.y
            );
            ctx.lineTo(
                center.x+halfWidth,
                center.y
            );

            const far=project(
                x,
                r.z+5000,
                cam
            );

            if(far){

                const fw=project(
                    x+r.w,
                    r.z+5000,
                    cam
                );

                const farHalf=
                    fw?
                    Math.abs(fw.x-far.x):
                    2;

                ctx.lineTo(
                    far.x+farHalf,
                    far.y
                );

                ctx.lineTo(
                    far.x-farHalf,
                    far.y
                );
            }else{

                ctx.lineTo(
                    W/2+halfWidth,
                    0
                );

                ctx.lineTo(
                    W/2-halfWidth,
                    0
                );
            }

            ctx.closePath();
            ctx.fill();

            drawRoadLines(
                x,
                r.z,
                r.w,
                cam,
                "v"
            );
        }
    }
}

function drawRoadLines(x,z,w,cam,type){

    ctx.strokeStyle="#d8d8c9";
    ctx.lineWidth=3;

    for(let i=-10;i<=10;i++){

        const off=i*250;

        let a,b;

        if(type==="h"){
            a=project(x+off,z,cam);
            b=project(x+off+80,z,cam);
        }else{
            a=project(x,z+off,cam);
            b=project(x,z+off+80,cam);
        }

        if(!a||!b)continue;

        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();
    }
}

function drawBuilding(b,cam){

    const p=project(b.x,b.z,cam);

    if(!p)return;

    const s=p.scale;

    const w=b.w*s;
    const h=b.h*s;
    const d=b.d*s;

    if(s<.015)return;

    ctx.save();

    ctx.translate(p.x,p.y);

    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.fillRect(-w*.55,4,w*1.15,Math.max(2,d*.18));

    ctx.fillStyle="#87929c";

    ctx.fillRect(
        -w/2,
        -h,
        w,
        h
    );

    ctx.fillStyle="#69757f";

    ctx.beginPath();
    ctx.moveTo(w/2,-h);
    ctx.lineTo(w/2+d*.18,-h+d*.12);
    ctx.lineTo(w/2+d*.18,d*.1);
    ctx.lineTo(w/2,0);
    ctx.closePath();
    ctx.fill();

    const rows=Math.max(2,Math.floor(b.h/42));

    for(let y=0;y<rows;y++){

        for(let xx=-2;xx<=2;xx++){

            if(Math.random()>.82)continue;

            ctx.fillStyle=
                (y+xx)%3===0?
                "#ffeaa0":
                "#25343e";

            ctx.fillRect(
                -w*.38+xx*w*.16,
                -h*.9+y*h*.18,
                Math.max(2,w*.09),
                Math.max(2,h*.09)
            );
        }
    }

    ctx.restore();
}

function drawTree(t,cam){

    const p=project(t.x,t.z,cam);

    if(!p)return;

    const s=p.scale;

    const h=t.h*s;

    if(s<.01)return;

    ctx.save();
    ctx.translate(p.x,p.y);

    ctx.fillStyle="#4c3420";
    ctx.fillRect(
        -4*s,
        -h*.38,
        8*s,
        h*.38
    );

    ctx.fillStyle=
        worldType==="forest"?
        "#246b32":
        "#2f8138";

    for(let i=0;i<3;i++){

        ctx.beginPath();

        ctx.moveTo(
            0,
            -h*.95+i*h*.18
        );

        ctx.lineTo(
            -t.r*s*(1-i*.2),
            -h*.48+i*h*.18
        );

        ctx.lineTo(
            t.r*s*(1-i*.2),
            -h*.48+i*h*.18
        );

        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawRock(r,cam){

    const p=project(r.x,r.z,cam);

    if(!p)return;

    const s=r.r*p.scale;

    if(s<1)return;

    ctx.fillStyle="#77736b";

    ctx.beginPath();
    ctx.ellipse(
        p.x,
        p.y,
        s,
        s*.55,
        0,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="rgba(255,255,255,.12)";

    ctx.beginPath();
    ctx.ellipse(
        p.x-s*.25,
        p.y-s*.18,
        s*.35,
        s*.15,
        -.3,
        0,
        Math.PI*2
    );
    ctx.fill();
}

function drawRamp(r,cam){

    const p=project(r.x,r.z,cam);

    if(!p)return;

    const s=Math.max(1,p.scale*100);

    if(s<2)return;

    ctx.save();
    ctx.translate(p.x,p.y);

    ctx.rotate(-r.angle);

    ctx.fillStyle="#242a30";

    ctx.beginPath();
    ctx.moveTo(-s,-s*.25);
    ctx.lineTo(s,-s*.25);
    ctx.lineTo(s*.65,s*.35);
    ctx.lineTo(-s*.65,s*.35);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#ffb000";

    ctx.beginPath();
    ctx.moveTo(-s*.72,-s*.15);
    ctx.lineTo(s*.72,-s*.15);
    ctx.lineTo(s*.48,s*.12);
    ctx.lineTo(-s*.48,s*.12);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawCoin(pickup,cam){

    const p=project(
        pickup.x,
        pickup.z,
        cam
    );

    if(!p)return;

    const s=Math.max(3,25*p.scale);

    pickup.spin+=.05;

    const width=
        Math.abs(Math.cos(pickup.spin))*s;

    ctx.save();

    ctx.translate(
        p.x,
        p.y-s*.6
    );

    ctx.fillStyle="#ffd21a";
    ctx.strokeStyle="#fff1a0";
    ctx.lineWidth=Math.max(1,s*.08);

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        Math.max(2,width),
        s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#fff4a4";
    ctx.font=`bold ${Math.max(6,s*.7)}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("$",0,1);

    ctx.restore();
}

function drawCheckpoint(c,cam){

    const p=project(
        c.x,
        c.z,
        cam
    );

    if(!p)return;

    const s=Math.max(5,65*p.scale);

    ctx.save();
    ctx.translate(p.x,p.y);

    ctx.strokeStyle="#00d9ff";
    ctx.lineWidth=Math.max(2,s*.08);

    ctx.beginPath();
    ctx.moveTo(-s,-s*1.7);
    ctx.lineTo(-s,0);
    ctx.moveTo(s,-s*1.7);
    ctx.lineTo(s,0);
    ctx.stroke();

    ctx.fillStyle="rgba(0,210,255,.18)";
    ctx.fillRect(
        -s,
        -s*1.7,
        s*2,
        s*.45
    );

    ctx.fillStyle="#fff";
    ctx.font=`bold ${Math.max(8,s*.35)}px Arial`;
    ctx.textAlign="center";
    ctx.fillText("CHECKPOINT",0,-s*1.4);

    ctx.restore();
}

function drawCar(car,cam,offsetX=0){

    const p=project(
        car.x,
        car.z,
        cam
    );

    if(!p)return;

    const s=
        Math.max(
            .3,
            Math.min(2.5,p.scale*125)
        );

    /*
       Car stays in lower-middle,
       giving the feeling of a chase camera.
    */

    const carY=
        Math.min(
            H*.78,
            p.y+55*s
        );

    ctx.save();

    ctx.translate(
        p.x+offsetX,
        carY
    );

    /*
       Subtle body lean while turning.
    */

    ctx.rotate(
        car.wheelTurn*.035
    );

    const width=72*s;
    const height=116*s;

    if(width<5){
        ctx.restore();
        return;
    }

    // Shadow
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.ellipse(
        0,
        15*s,
        width*.68,
        height*.22,
        0,
        0,
        Math.PI*2
    );
    ctx.fill();

    // Rear body
    ctx.fillStyle=car.color;

    ctx.beginPath();
    ctx.moveTo(
        -width*.46,
        height*.30
    );

    ctx.lineTo(
        -width*.55,
        -height*.05
    );

    ctx.lineTo(
        -width*.38,
        -height*.43
    );

    ctx.lineTo(
        width*.38,
        -height*.43
    );

    ctx.lineTo(
        width*.55,
        -height*.05
    );

    ctx.lineTo(
        width*.46,
        height*.30
    );

    ctx.closePath();
    ctx.fill();

    // Dark lower bumper
    ctx.fillStyle=car.accent;

    ctx.beginPath();
    ctx.moveTo(
        -width*.47,
        height*.17
    );

    ctx.lineTo(
        width*.47,
        height*.17
    );

    ctx.lineTo(
        width*.39,
        height*.36
    );

    ctx.lineTo(
        -width*.39,
        height*.36
    );

    ctx.closePath();
    ctx.fill();

    // Rear window
    ctx.fillStyle="#15202a";

    ctx.beginPath();
    ctx.moveTo(
        -width*.34,
        -height*.34
    );

    ctx.lineTo(
        width*.34,
        -height*.34
    );

    ctx.lineTo(
        width*.25,
        -height*.08
    );

    ctx.lineTo(
        -width*.25,
        -height*.08
    );

    ctx.closePath();
    ctx.fill();

    // Window reflection
    ctx.fillStyle="rgba(170,230,255,.45)";

    ctx.beginPath();
    ctx.moveTo(
        -width*.28,
        -height*.30
    );

    ctx.lineTo(
        width*.12,
        -height*.30
    );

    ctx.lineTo(
        width*.02,
        -height*.16
    );

    ctx.lineTo(
        -width*.20,
        -height*.16
    );

    ctx.closePath();
    ctx.fill();

    // Tail lights
    ctx.fillStyle="#ff2020";

    ctx.fillRect(
        -width*.43,
        height*.02,
        width*.22,
        height*.09
    );

    ctx.fillRect(
        width*.21,
        height*.02,
        width*.22,
        height*.09
    );

    // Brake glow
    if(car.speed<1){

        ctx.shadowBlur=12*s;
        ctx.shadowColor="#ff2222";

        ctx.fillRect(
            -width*.43,
            height*.02,
            width*.22,
            height*.09
        );

        ctx.fillRect(
            width*.21,
            height*.02,
            width*.22,
            height*.09
        );

        ctx.shadowBlur=0;
    }

    // Rear spoiler
    ctx.fillStyle=car.accent;

    ctx.fillRect(
        -width*.45,
        -height*.43,
        width*.90,
        height*.06
    );

    // Wheels
    ctx.fillStyle="#080a0d";

    ctx.fillRect(
        -width*.57,
        -height*.02,
        width*.16,
        height*.28
    );

    ctx.fillRect(
        width*.41,
        -height*.02,
        width*.16,
        height*.28
    );

    // Wheel highlights
    ctx.fillStyle="#50565c";

    ctx.fillRect(
        -width*.54,
        height*.02,
        width*.08,
        height*.13
    );

    ctx.fillRect(
        width*.46,
        height*.02,
        width*.08,
        height*.13
    );

    // Exhaust
    ctx.fillStyle="#17191c";

    ctx.fillRect(
        -width*.27,
        height*.31,
        width*.12,
        height*.06
    );

    ctx.fillRect(
        width*.15,
        height*.31,
        width*.12,
        height*.06
    );

    // Speed effect
    if(Math.abs(car.speed)>7){

        ctx.strokeStyle="rgba(255,255,255,.18)";
        ctx.lineWidth=Math.max(1,s*2);

        for(let i=0;i<4;i++){

            const xx=
                (i-1.5)*width*.3;

            ctx.beginPath();
            ctx.moveTo(
                xx,
                height*.42
            );

            ctx.lineTo(
                xx,
                height*(.65+Math.random()*.25)
            );

            ctx.stroke();
        }
    }

    ctx.restore();
}

function burst(x,z,type){

    for(let i=0;i<15;i++){

        particles.push({
            x,
            z,
            vx:rand(-3,3),
            vz:rand(-3,3),
            life:1,
            type
        });
    }
}

function updateParticles(dt){

    for(const p of particles){

        p.x+=p.vx*dt*60;
        p.z+=p.vz*dt*60;
        p.life-=dt;
    }

    particles=particles.filter(p=>p.life>0);
}

function drawParticles(cam){

    for(const p of particles){

        const q=project(
            p.x,
            p.z,
            cam
        );

        if(!q)continue;

        const s=Math.max(2,8*q.scale);

        ctx.globalAlpha=
            Math.max(0,p.life);

        ctx.fillStyle=
            p.type==="coin"?
            "#ffd21a":
            p.type==="boost"?
            "#ff7a00":
            "#00d9ff";

        ctx.beginPath();
        ctx.arc(
            q.x,
            q.y,
            s,
            0,
            Math.PI*2
        );
        ctx.fill();
    }

    ctx.globalAlpha=1;
}

function drawMiniMap(car){

    const size=145;
    const pad=18;
    const x=pad;
    const y=H-size-pad;

    ctx.save();

    ctx.globalAlpha=.9;

    ctx.fillStyle="rgba(5,8,12,.72)";
    ctx.beginPath();
    ctx.roundRect(
        x,
        y,
        size,
        size,
        14
    );
    ctx.fill();

    ctx.strokeStyle="rgba(255,255,255,.12)";
    ctx.stroke();

    const scale=size/6500;

    ctx.save();

    ctx.translate(
        x+size/2,
        y+size/2
    );

    for(const r of roadSegments){

        ctx.strokeStyle="#646a70";
        ctx.lineWidth=Math.max(2,r.w*scale);

        if(r.type==="h"){

            ctx.beginPath();
            ctx.moveTo(-size/2, r.z*scale);
            ctx.lineTo(size/2, r.z*scale);
            ctx.stroke();

        }else{

            ctx.beginPath();
            ctx.moveTo(r.x*scale,-size/2);
            ctx.lineTo(r.x*scale,size/2);
            ctx.stroke();
        }
    }

    ctx.fillStyle="#00c8ff";

    ctx.beginPath();
    ctx.arc(
        car.x*scale,
        car.z*scale,
        5,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.rotate(car.angle);

    ctx.fillStyle="#fff";

    ctx.beginPath();
    ctx.moveTo(0,-13);
    ctx.lineTo(-5,7);
    ctx.lineTo(5,7);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    ctx.fillStyle="white";
    ctx.font="bold 10px Arial";
    ctx.fillText(
        "MAP",
        x+10,
        y+15
    );

    ctx.restore();
}

function updateHUD(){

    document.getElementById("coins").textContent=coins;

    document.getElementById("checkpoint").textContent=
        car1?
        car1.checkpoint:
        0;

    document.getElementById("speed").textContent=
        car1?
        Math.round(Math.abs(car1.speed)*18):
        0;
}

function update(dt){

    if(!gameRunning||paused)return;

    updateCar(car1,dt,1);

    if(car2){
        updateCar(car2,dt,2);
    }

    updateCamera(car1,dt);

    if(car2){
        updateCamera(car2,dt);
    }

    updateParticles(dt);

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){
            document.getElementById("centerMessage").style.opacity="0";
        }
    }

    updateHUD();
}

function render(){

    ctx.clearRect(0,0,W,H);

    if(!gameRunning)return;

    if(players===1){

        const cam=updateCamera(car1,1/120);

        drawWorld(cam);
        drawParticles(cam);
        drawCar(car1,cam);

        drawMiniMap(car1);

    }else{

        const half=W/2;

        ctx.save();

        ctx.beginPath();
        ctx.rect(0,0,half,H);
        ctx.clip();

        const cam1=updateCamera(car1,1/120);

        drawWorld(cam1);
        drawParticles(cam1);
        drawCar(car1,cam1);

        ctx.restore();

        ctx.save();

        ctx.beginPath();
        ctx.rect(half,0,half,H);
        ctx.clip();

        const cam2=updateCamera(car2,1/120);

        drawWorld(cam2);
        drawParticles(cam2);
        drawCar(car2,cam2);

        ctx.restore();

        ctx.fillStyle="rgba(255,255,255,.8)";
        ctx.fillRect(half-1,0,2,H);

        ctx.fillStyle="rgba(0,0,0,.45)";
        ctx.fillRect(0,0,100,28);
        ctx.fillRect(half,0,half+100,28);

        ctx.fillStyle="white";
        ctx.font="bold 12px Arial";
        ctx.fillText("PLAYER 1",12,18);
        ctx.fillText("PLAYER 2",half+12,18);
    }
}

function loop(now){

    const dt=
        Math.min(
            .033,
            Math.max(
                .001,
                (now-lastTime)/1000
            )
        );

    lastTime=now;

    update(dt);
    render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* Prevent accidental browser gestures */
document.addEventListener("contextmenu",e=>e.preventDefault());

/* Start screen stays visible */
showMenu();

</script>
