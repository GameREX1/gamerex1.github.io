<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GamerEx - Glam Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --pink:#d83c91;
  --pink2:#b62675;
  --purple:#8d63c7;
  --text:#292033;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#f7e8ff,#ffeaf4,#e8f4ff);
  color:var(--text);
  overflow-x:hidden;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}

.game{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  height:72px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(120,70,160,.15);
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:var(--pink);
}

.coinBox{
  background:#fff0fa;
  color:var(--pink2);
  padding:10px 16px;
  border-radius:25px;
  font-size:14px;
}

/* MAIN */
.main{
  flex:1;
  display:grid;
  grid-template-columns:260px 1fr 320px;
  gap:18px;
  padding:18px;
  max-width:1500px;
  width:100%;
  margin:auto;
}

/* PANELS */
.panel{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(130,70,160,.12);
  border-radius:22px;
  box-shadow:0 12px 35px rgba(80,40,100,.08);
  padding:16px;
}

.panelTitle{
  font-size:18px;
  margin-bottom:13px;
}

.categories{
  display:grid;
  gap:9px;
}

.cat{
  width:100%;
  padding:13px;
  border-radius:14px;
  background:#f8f3fb;
  color:#51415e;
  text-align:left;
  transition:.2s;
}

.cat:hover,
.cat.active{
  background:var(--pink);
  color:white;
  transform:translateX(3px);
}

/* LEVELS */
.levelBox{
  margin-top:18px;
  padding:13px;
  border-radius:17px;
  background:linear-gradient(135deg,#fff3fb,#f4efff);
  border:1px solid rgba(216,60,145,.12);
}

.levelHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.levelTitle{
  font-size:15px;
  font-weight:900;
}

.levelNow{
  font-size:12px;
  color:var(--pink);
  font-weight:bold;
}

.levels{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.levelBtn{
  padding:9px 4px;
  border-radius:10px;
  background:#eee8f4;
  color:#62566b;
  font-size:12px;
}

.levelBtn.active{
  background:var(--pink);
  color:white;
}

.levelBtn.completed{
  background:#9d70d2;
  color:white;
}

.levelBtn.locked{
  opacity:.35;
  cursor:not-allowed;
}

.levelInfo{
  margin-top:9px;
  font-size:11px;
  color:#6c6072;
  line-height:1.45;
}

.levelProgress{
  height:7px;
  background:#eadff0;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.levelProgressBar{
  height:100%;
  width:0%;
  background:var(--pink);
  border-radius:20px;
  transition:.3s;
}

/* CHARACTER AREA */
.stage{
  min-height:650px;
  border-radius:25px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:linear-gradient(#dff5ff,#fff0fa);
  box-shadow:0 12px 35px rgba(80,40,100,.1);
  perspective:1000px;
}

.bg1{background:linear-gradient(#dff6ff 0%,#f8e9ff 58%,#f8cfe3 100%)}
.bg2{background:linear-gradient(#fff1c7,#ffd9e9 60%,#e5c9ff)}
.bg3{background:linear-gradient(#d9ffe9,#d9e9ff 55%,#f4d7ff)}
.bg4{background:linear-gradient(#25233e,#55436c 55%,#171526)}
.bg5{background:linear-gradient(#fff4df,#ffe0ed,#e8d7ff)}
.bg6{background:linear-gradient(#d9f2ff,#fff0f8,#ffd5e5)}
.bg7{background:linear-gradient(#e6dcff,#f9e6ff,#d8f4ff)}
.bg8{background:linear-gradient(#e9fff6,#fff3df,#e3e5ff)}
.bg9{background:linear-gradient(#ffdce9,#ffeecf,#dfd8ff)}
.bg10{background:linear-gradient(#dceaff,#e5dcff,#ffdbea)}

.room{
  position:absolute;
  inset:0;
}

.window{
  position:absolute;
  width:170px;
  height:220px;
  top:50px;
  left:50%;
  transform:translateX(-50%);
  border:12px solid rgba(255,255,255,.8);
  background:linear-gradient(120deg,#c5ecff,#fbd6ed);
  box-shadow:0 12px 30px rgba(70,50,90,.12);
}

.floor{
  position:absolute;
  bottom:0;
  width:100%;
  height:27%;
  background:rgba(255,255,255,.3);
  border-top:2px solid rgba(255,255,255,.65);
}

/* CHALLENGE CARD */
.challengeCard{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  z-index:14;
  max-width:390px;
  background:rgba(255,255,255,.92);
  border-radius:17px;
  padding:12px 14px;
  box-shadow:0 7px 22px rgba(60,30,80,.12);
}

.challengeSmall{
  font-size:10px;
  color:var(--pink);
  font-weight:900;
  text-transform:uppercase;
}

.challengeName{
  font-size:16px;
  font-weight:900;
  margin:3px 0;
}

.challengeText{
  font-size:11px;
  color:#6a5d70;
  line-height:1.35;
}

.hintButton{
  margin-top:8px;
  padding:8px 12px;
  border-radius:10px;
  background:#fff0a8;
  color:#775900;
  font-size:11px;
}

/* ROTATE */
.rotateButton{
  position:absolute;
  top:18px;
  right:18px;
  z-index:15;
  padding:11px 15px;
  border-radius:14px;
  background:rgba(255,255,255,.9);
  color:#c02d7e;
  box-shadow:0 6px 18px rgba(70,40,90,.12);
}

/* CHARACTER */
.character{
  position:relative;
  width:300px;
  height:580px;
  z-index:5;
  transform:scale(1) rotateY(0deg);
  transform-origin:bottom center;
  transform-style:preserve-3d;
  transition:transform .75s ease;
}

.character.rotated{
  transform:scale(1) rotateY(180deg);
}

/* HAIR BACK */
.hair{
  position:absolute;
  width:150px;
  height:165px;
  left:75px;
  top:28px;
  border-radius:55% 55% 42% 42%;
  background:#3b211c;
  z-index:2;
  pointer-events:none;
}

.hair.long{
  height:245px;
  border-radius:55% 55% 30% 30%;
}

.hair.bob{
  height:185px;
  border-radius:55% 55% 35% 35%;
}

.hair.ponytail{
  height:180px;
  border-radius:55% 55% 40% 40%;
}

.hair.curly{
  height:230px;
  border-radius:50%;
}

.hair.front{
  width:125px;
  height:58px;
  left:88px;
  top:32px;
  border-radius:60% 60% 35% 35%;
  z-index:9;
}

/* HEAD */
.head{
  position:absolute;
  width:134px;
  height:150px;
  border-radius:48% 48% 46% 46%;
  background:#f1bd91;
  top:43px;
  left:83px;
  z-index:8;
  box-shadow:
    inset -8px -10px 0 rgba(150,80,50,.06),
    inset 6px 4px 0 rgba(255,255,255,.08);
}

.face{
  position:absolute;
  inset:0;
}

.ear{
  position:absolute;
  width:18px;
  height:35px;
  background:#efb98d;
  border-radius:50%;
  top:98px;
  z-index:4;
}

.ear.left{left:77px}
.ear.right{left:207px}

.eyebrow{
  position:absolute;
  width:31px;
  height:6px;
  background:#59372d;
  border-radius:10px;
  top:32px;
  z-index:13;
}

.eyebrow.left{left:23px;transform:rotate(-6deg)}
.eyebrow.right{left:81px;transform:rotate(6deg)}

.eyeArea{
  position:absolute;
  width:43px;
  height:27px;
  top:44px;
  z-index:11;
}

.eyeArea.left{left:20px}
.eyeArea.right{left:77px}

.eyeWhite{
  position:absolute;
  width:37px;
  height:20px;
  left:3px;
  top:2px;
  background:#fff;
  border-radius:50%;
  border:1px solid rgba(80,50,55,.18);
}

.pupil{
  position:absolute;
  width:12px;
  height:14px;
  left:15px;
  top:5px;
  border-radius:50%;
  background:#3b2730;
}

.pupil:after{
  content:"";
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  left:3px;
  top:2px;
}

.eyeLine{
  position:absolute;
  width:42px;
  height:7px;
  border-top:3px solid #29202b;
  border-radius:50%;
  top:0;
  left:0;
}

.eyeLine.right{transform:rotate(-2deg)}

.eyesShadow{
  position:absolute;
  width:43px;
  height:18px;
  border-radius:50%;
  background:#b46bd0;
  opacity:.35;
  top:37px;
  z-index:9;
  filter:blur(1px);
}

.eyesShadow.left{left:20px}
.eyesShadow.right{left:77px}

.lash{
  position:absolute;
  width:31px;
  height:8px;
  top:39px;
  z-index:14;
  border-top:3px solid #29202b;
  border-radius:50%;
}

.lash.left{left:22px;transform:rotate(-5deg)}
.lash.right{left:77px;transform:rotate(5deg)}

.lowerEye{
  position:absolute;
  width:30px;
  height:8px;
  border-bottom:2px solid rgba(80,45,55,.28);
  border-radius:50%;
  top:60px;
  z-index:12;
}

.lowerEye.left{left:26px}
.lowerEye.right{left:81px}

.blush{
  position:absolute;
  width:34px;
  height:19px;
  border-radius:50%;
  background:#ee577d;
  opacity:.35;
  top:74px;
  z-index:10;
  filter:blur(1px);
}

.blush.left{left:13px}
.blush.right{left:89px}

.nose{
  position:absolute;
  width:18px;
  height:25px;
  left:58px;
  top:62px;
  z-index:10;
}

.nose:before{
  content:"";
  position:absolute;
  width:12px;
  height:20px;
  left:3px;
  top:0;
  border-right:2px solid rgba(150,80,55,.35);
  border-bottom:2px solid rgba(150,80,55,.22);
  border-radius:50%;
}

.lips{
  position:absolute;
  width:24px;
  height:11px;
  left:55px;
  top:95px;
  z-index:15;
  background:#d65b78;
  border-radius:50%;
}

.lips:after{
  content:"";
  position:absolute;
  width:14px;
  height:2px;
  left:5px;
  top:6px;
  background:rgba(90,30,50,.28);
  border-radius:50%;
}

/* BODY */
.neck{
  position:absolute;
  width:55px;
  height:70px;
  background:#efb98d;
  left:122px;
  top:165px;
  z-index:2;
}

.body{
  position:absolute;
  width:190px;
  height:240px;
  left:55px;
  top:205px;
  background:#f09aaf;
  border-radius:35px 35px 25px 25px;
  z-index:3;
}

.skirt{
  position:absolute;
  width:220px;
  height:125px;
  left:40px;
  top:405px;
  background:#e9b7d7;
  clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);
  z-index:4;
}

.skirt.style2{
  clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);
}

.skirt.style3{
  border-radius:0 0 60% 60%;
}

.leg{
  position:absolute;
  width:47px;
  height:120px;
  background:#efb98d;
  top:475px;
  z-index:2;
  border-radius:20px;
}

.leg.left{left:96px}
.leg.right{left:158px}

.shoe{
  position:absolute;
  width:70px;
  height:30px;
  background:#292331;
  border-radius:30px 30px 12px 12px;
  top:555px;
  z-index:6;
}

.shoe.left{left:73px}
.shoe.right{left:157px}

/* DETAILS */
.jacket{
  position:absolute;
  width:200px;
  height:100px;
  left:50px;
  top:210px;
  border:12px solid #6d4a9b;
  border-bottom:0;
  border-radius:30px 30px 0 0;
  z-index:8;
}

.belt{
  position:absolute;
  width:190px;
  height:13px;
  left:55px;
  top:390px;
  background:#4b344f;
  z-index:8;
}

/* BAG */
.bag{
  position:absolute;
  width:58px;
  height:45px;
  left:202px;
  top:305px;
  background:#e75b9d;
  border-radius:10px 10px 15px 15px;
  z-index:10;
  box-shadow:0 4px 7px rgba(50,30,50,.12);
}

.bag:before{
  content:"";
  position:absolute;
  width:34px;
  height:25px;
  left:12px;
  top:-18px;
  border:5px solid currentColor;
  border-bottom:0;
  border-radius:20px 20px 0 0;
}

.bag.gold{color:#c99b38;background:#e6bd55}
.bag.black{color:#292331;background:#292331}
.bag.white{color:#aaa;background:#f7f5f5}
.bag.blue{color:#5578d2;background:#5578d2}
.bag.purple{color:#8e60bb;background:#9b70c8}
.bag.green{color:#579778;background:#69ad8e}
.bag.pink{color:#d94e9c;background:#df6aa8}

/* ACCESSORIES */
.glasses{
  position:absolute;
  width:95px;
  height:30px;
  left:102px;
  top:103px;
  z-index:16;
}

.glasses:before,
.glasses:after{
  content:"";
  position:absolute;
  width:35px;
  height:24px;
  border:4px solid #29232d;
  border-radius:50%;
}

.glasses:before{left:0}
.glasses:after{right:0}

.glasses .bridge{
  position:absolute;
  width:25px;
  height:4px;
  background:#29232d;
  left:35px;
  top:10px;
}

.earring{
  position:absolute;
  width:12px;
  height:18px;
  border:3px solid #e2b44f;
  border-radius:50%;
  top:130px;
  z-index:14;
}

.earring.left{left:80px}
.earring.right{left:208px}

.necklace{
  position:absolute;
  width:65px;
  height:45px;
  border-bottom:4px solid #d7ad4d;
  border-radius:50%;
  left:117px;
  top:175px;
  z-index:10;
}

.necklaceGem{
  position:absolute;
  width:12px;
  height:12px;
  background:#e95c9e;
  transform:rotate(45deg);
  left:143px;
  top:202px;
  z-index:11;
}

/* BACK VIEW */
.character.rotated .face,
.character.rotated .glasses,
.character.rotated .earring,
.character.rotated .necklace,
.character.rotated .necklaceGem,
.character.rotated .hair.front{
  visibility:hidden;
}

.character.rotated .hair{
  z-index:12;
}

.character.rotated .body:after{
  content:"";
  position:absolute;
  width:80px;
  height:100px;
  left:55px;
  top:45px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
}

/* RIGHT */
.itemsPanel{
  display:flex;
  flex-direction:column;
  min-height:650px;
}

.items{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  overflow-y:auto;
  max-height:475px;
  padding-right:3px;
}

.item{
  min-height:82px;
  border-radius:14px;
  background:#f7f2fa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:.2s;
  color:#4b3c55;
}

.item:hover{
  transform:translateY(-3px);
  background:#f4ddec;
}

.item.selected{
  outline:3px solid var(--pink);
  background:#ffe9f6;
}

.itemIcon{
  font-size:28px;
}

.itemName{
  font-size:10px;
  text-align:center;
}

.scoreBox{
  margin-top:12px;
  background:#fff4fa;
  padding:12px;
  border-radius:15px;
  text-align:center;
}

.score{
  font-size:26px;
  font-weight:900;
  color:var(--pink);
}

.bottomButtons{
  margin-top:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding-top:14px;
}

.action{
  padding:13px;
  border-radius:13px;
  background:#efe8f4;
  color:#4a3b52;
}

.action.primary{
  background:var(--pink);
  color:white;
}

/* POPUPS */
.levelOverlay,
.overlay{
  position:fixed;
  inset:0;
  background:rgba(35,22,42,.55);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:110;
  padding:20px;
}

.levelModal,
.modal{
  width:min(520px,100%);
  background:white;
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.levelModal h2,
.modal h2{
  color:var(--pink);
  margin-bottom:8px;
}

.levelModal p,
.modal p{
  color:#685d70;
  margin-bottom:18px;
  line-height:1.5;
}

.reward{
  font-size:30px;
  font-weight:900;
  color:var(--pink2);
  margin:15px;
}

.hintText{
  background:#fff8d7;
  color:#705800;
  border-radius:15px;
  padding:13px;
  margin:12px 0;
  font-size:13px;
  line-height:1.5;
}

.completeLevel{
  background:var(--pink);
  color:white;
  padding:13px 24px;
  border-radius:12px;
  margin:4px;
}

.closeLevel,
.close{
  background:#eee8f4;
  color:#4a3b52;
  padding:13px 24px;
  border-radius:12px;
  margin:4px;
}

/* MOBILE */
@media(max-width:1050px){
  .main{
    grid-template-columns:210px 1fr;
  }

  .itemsPanel{
    grid-column:1/-1;
    min-height:auto;
  }

  .items{
    grid-template-columns:repeat(6,1fr);
  }
}

@media(max-width:700px){
  header{
    height:62px;
    padding:0 13px;
  }

  .logo{
    font-size:20px;
  }

  .main{
    grid-template-columns:1fr;
    padding:10px;
  }

  .categories{
    grid-template-columns:repeat(4,1fr);
  }

  .cat{
    text-align:center;
    padding:10px 5px;
    font-size:11px;
  }

  .stage{
    min-height:590px;
  }

  .challengeCard{
    max-width:270px;
    top:12px;
    left:12px;
  }

  .rotateButton{
    top:12px;
    right:12px;
    padding:9px 11px;
    font-size:11px;
  }

  .character{
    transform:scale(.88) rotateY(0deg);
    margin-bottom:-20px;
  }

  .character.rotated{
    transform:scale(.88) rotateY(180deg);
  }

  .items{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:430px){
  .stage{
    min-height:550px;
  }

  .character{
    transform:scale(.78) rotateY(0deg);
    margin-bottom:-35px;
  }

  .character.rotated{
    transform:scale(.78) rotateY(180deg);
  }

  .items{
    grid-template-columns:repeat(3,1fr);
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
  }

  .challengeCard{
    max-width:220px;
  }

  .challengeName{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="game">

<header>
  <div class="logo">GAMER<span>EX</span> ✨</div>
  <div class="coinBox">💎 Style Coins: <b id="coins">250</b></div>
</header>

<div class="main">

<!-- LEFT -->
<div class="panel">

  <div class="panelTitle">✨ Style Studio</div>

  <div class="categories">

    <button class="cat active" onclick="selectCategory('outfit',this)">👗 Outfits</button>
    <button class="cat" onclick="selectCategory('hair',this)">💇 Hair</button>
    <button class="cat" onclick="selectCategory('makeup',this)">💄 Makeup</button>
    <button class="cat" onclick="selectCategory('shoes',this)">👠 Shoes</button>
    <button class="cat" onclick="selectCategory('bags',this)">👜 Bags</button>
    <button class="cat" onclick="selectCategory('jewelry',this)">💎 Jewelry</button>
    <button class="cat" onclick="selectCategory('glasses',this)">🕶️ Glasses</button>
    <button class="cat" onclick="selectCategory('background',this)">🏠 Scene</button>

  </div>

  <div class="levelBox">

function selectCategory(category,button){

  currentCategory=category;

  document.querySelectorAll(".cat").forEach(x=>{
    x.classList.remove("active");
  });

  button.classList.add("active");

  renderItems();
}

/* =========================================================
   ITEMS
========================================================= */

function renderItems(){

  const container=document.getElementById("items");

  container.innerHTML="";

  const title={
    outfit:"👗 Choose an Outfit",
    hair:"💇 Choose a Hairstyle",
    makeup:"💄 Choose Makeup",
    shoes:"👠 Choose Shoes",
    bags:"👜 Choose a Bag",
    jewelry:"💎 Choose Jewelry",
    glasses:"🕶️ Choose Glasses",
    background:"🏠 Choose a Scene"
  };

  document.getElementById("itemTitle").textContent=
    title[currentCategory];

  data[currentCategory].forEach((item,index)=>{

    const btn=document.createElement("button");

    btn.className="item";

    if(state[currentCategory]===index){
      btn.classList.add("selected");
    }

    btn.innerHTML=`
      <div class="itemIcon">${item.icon}</div>
      <div class="itemName">${item.name}</div>
    `;

    btn.onclick=()=>{

      state[currentCategory]=index;

      applySelection();

      renderItems();
    };

    container.appendChild(btn);

  });
}

    makeup.liner?"block":"none";

  const shoe=data.shoes[state.shoes];

  document.getElementById("shoeL").style.background=
    shoe.color;

  document.getElementById("shoeR").style.background=
    shoe.color;

  const bag=data.bags[state.bags];

  const bagEl=document.getElementById("bag");

  if(state.bags===0){
    bagEl.style.display="none";
  }else{
    bagEl.style.display="block";
    bagEl.className="bag "+bag.color;
  }

  const jewelry=data.jewelry[state.jewelry];

  document.getElementById("earringL").style.display=
    jewelry.value>=6?"block":"none";

  document.getElementById("earringR").style.display=
    jewelry.value>=6?"block":"none";

  document.getElementById("necklace").style.display=
    jewelry.value>=12?"block":"none";

  document.getElementById("necklaceGem").style.display=
    jewelry.value>=18?"block":"none";

  const glasses=data.glasses[state.glasses];

  document.getElementById("glasses").style.display=
    glasses.value>0?"block":"none";

  const bg=data.background[state.background];

  document.getElementById("stage").className=
    "stage "+bg.bg;

  updateScore();
  updateLevelProgress();
  updateChallengeCard();
}

/* =========================================================
   SCORE
========================================================= */

function updateScore(){

  let score=50;

  if(state.outfit!==0) score+=7;
  if(state.hair!==0) score+=7;
  if(state.makeup!==0) score+=8;
  if(state.shoes!==0) score+=5;
  if(state.bags!==0) score+=5;
  if(state.jewelry!==0) score+=7;
  if(state.glasses!==0) score+=4;

  const makeup=data.makeup[state.makeup];

  if(makeup.shadow) score+=2;
  if(makeup.blush) score+=2;
  if(makeup.liner) score+=2;

  if(
    state.outfit!==0 &&
    state.hair!==0 &&
    state.makeup!==0 &&
    state.shoes!==0 &&
    state.jewelry!==0
  ){
    score+=5;
  }

  return Math.min(score,100);
}

/* =========================================================
   CHALLENGE MATCH
========================================================= */

function matchesChallenge(level){

  const req=level.req;

  const outfit=data.outfit[state.outfit];
  const hair=data.hair[state.hair];
  const makeup=data.makeup[state.makeup];
  const shoes=data.shoes[state.shoes];
  const bag=data.bags[state.bags];
  const jewelry=data.jewelry[state.jewelry];
  const glasses=data.glasses[state.glasses];

  if(req.outfit && !req.outfit.includes(outfit.tag)){
    return false;
  }

  if(req.hair && !req.hair.includes(hair.tag)){
    return false;
  }

  if(req.makeup && !req.makeup.includes(makeup.tag)){
    return false;
  }

  if(req.shoes && !req.shoes.includes(shoes.tag)){
    return false;
  }

  if(req.bags && !req.bags.includes(bag.tag)){
    return false;
  }

  if(req.jewelryMin && jewelry.value<req.jewelryMin){
    return false;
  }

  if(req.glassesMin && glasses.value<req.glassesMin){
    return false;
  }

  return true;
}

/* =========================================================
   LEVEL UI
========================================================= */

function renderLevels(){

  const container=document.getElementById("levels");

  container.innerHTML="";

  levels.forEach((level,index)=>{

    const number=index+1;

    const btn=document.createElement("button");

    btn.className="levelBtn";

    btn.textContent=number;

    if(completedLevels.includes(number)){
      btn.classList.add("completed");
    }

    if(number===currentLevel){
      btn.classList.add("active");
    }

    if(number>currentLevel){
      btn.classList.add("locked");
    }

    btn.onclick=()=>{
      openLevel(number);
    };

    container.appendChild(btn);

  });
}

function updateLevelUI(){

  document.getElementById("levelNow").textContent=
    "Level "+currentLevel;

  const level=levels[currentLevel-1];

  document.getElementById("levelInfo").textContent=
    level.name+
    " • Score "+
    level.target+
    "+ • Reward "+
    level.reward+
    " coins";

  updateChallengeCard();

  renderLevels();

  updateLevelProgress();
}

/* =========================================================
   CHALLENGE CARD
========================================================= */

function updateChallengeCard(){

  const level=levels[currentLevel-1];

  document.getElementById("challengeName").textContent=
    level.name;

  document.getElementById("challengeText").textContent=
    level.text;
}

/* =========================================================
   PROGRESS
========================================================= */

function updateLevelProgress(){

  const level=levels[currentLevel-1];

  const score=updateScore();

  let progress=
    Math.round((score/level.target)*100);

  if(matchesChallenge(level)){
    progress+=10;
  }

  progress=Math.max(0,Math.min(progress,100));

  document.getElementById("levelProgressBar").style.width=
    progress+"%";
}

/* =========================================================
   OPEN LEVEL
========================================================= */

function openLevel(levelNumber){

  if(levelNumber>currentLevel){
    alert("🔒 Complete the previous challenge first!");
    return;
  }

  selectedLevel=levelNumber;

  const level=levels[levelNumber-1];

  document.getElementById("levelModalTitle").textContent=
    "Level "+levelNumber+" — "+level.name;

  document.getElementById("levelModalText").textContent=
    level.text;

  document.getElementById("levelHint").textContent=
    level.hint;

  document.getElementById("levelReward").textContent=
    "🪙 +"+level.reward+" Style Coins";

  const button=document.querySelector(".completeLevel");

  if(completedLevels.includes(levelNumber)){

    button.textContent="✅ Completed";
    button.disabled=true;
    button.style.opacity=".6";

  }else{

    button.textContent="Complete Challenge";
    button.disabled=false;
    button.style.opacity="1";
  }

  document.getElementById("levelOverlay").style.display="flex";
}

/* =========================================================
   COMPLETE LEVEL
========================================================= */

function completeLevel(){

  const level=levels[selectedLevel-1];

  const score=updateScore();

  const challengeOK=matchesChallenge(level);

  if(score<level.target){

    alert(
      "❌ Your Style Score is too low.\n\n"+
      "Required: "+level.target+
      "\nYour score: "+score+
      "\n\nUse the Hint for help!"
    );

    return;
  }

  if(!challengeOK){

    alert(
      "💡 The look doesn't match the challenge yet!\n\n"+
      "Read the Hint and change the outfit, hair, makeup or accessories."
    );

    return;
  }

  if(completedLevels.includes(selectedLevel)){
    return;
  }

  completedLevels.push(selectedLevel);

  coins+=level.reward;

  document.getElementById("coins").textContent=coins;

  if(
    selectedLevel===currentLevel &&
    currentLevel<levels.length
  ){
    currentLevel++;
  }

  closeLevel();

  updateLevelUI();

  setTimeout(()=>{

    alert(
      "🎉 Challenge Complete!\n\n"+
      "🏆 "+level.name+
      "\n🪙 You earned "+level.reward+
      " Style Coins!"
    );

  },100);
}

/* =========================================================
   HINT
========================================================= */

function showHint(){

  const level=levels[currentLevel-1];

  document.getElementById("levelModalTitle").textContent=
    "💡 Level "+currentLevel+" Hint";

  document.getElementById("levelModalText").textContent=
    level.name;

  document.getElementById("levelHint").textContent=
    level.hint;

  document.getElementById("levelReward").textContent=
    "🎯 Target Score: "+level.target;

  document.querySelector(".completeLevel").style.display="none";

  document.getElementById("levelOverlay").style.display="flex";

  setTimeout(()=>{

    document.querySelector(".completeLevel").style.display=
      "inline-block";

  },100);
}

/* =========================================================
   CLOSE LEVEL
========================================================= */

function closeLevel(){

  document.getElementById("levelOverlay").style.display=
    "none";
}

/* =========================================================
   ROTATE
========================================================= */

function rotateCharacter(){

  const character=document.getElementById("character");

  isRotated=!isRotated;

  character.classList.toggle("rotated",isRotated);

  document.getElementById("rotateButton").textContent=
    isRotated
      ?"🔄 Show Front"
      :"🔄 Rotate Character";
}

/* =========================================================
   RANDOM
========================================================= */

function randomLook(){

  Object.keys(state).forEach(key=>{

    state[key]=Math.floor(
      Math.random()*data[key].length
    );

  });

  applySelection();
  renderItems();
}

/* =========================================================
   RESET
========================================================= */

function resetLook(){

  state={
    outfit:0,
    hair:0,
    makeup:0,
    shoes:0,
    bags:0,
    jewelry:0,
    glasses:0,
    background:0
  };

  applySelection();
  renderItems();
}

/* =========================================================
   BACKGROUND
========================================================= */

function changeBackground(){

  state.background=
    (state.background+1)%
    data.background.length;

  applySelection();

  if(currentCategory==="background"){
    renderItems();
  }
}

/* =========================================================
   FINAL
========================================================= */

function showFinal(){

  const score=updateScore();

  const level=levels[currentLevel-1];

  let message="Nice look! 💖";

  if(matchesChallenge(level)){
    message=
      "Perfect! Your look matches the current challenge! 🎯✨";
  }

  if(score>=90){
    message=
      "WOW! You're a true fashion superstar! ✨👑";
  }
  else if(score>=75){
    message=
      "Amazing style! This look is gorgeous! 💕";
  }
  else if(score>=60){
    message=
      "Great look! Keep experimenting! 🌸";
  }

  document.getElementById("finalText").textContent=
    message;

  document.getElementById("finalScore").textContent=
    score+"/100";

  document.getElementById("overlay").style.display=
    "flex";
}

/* =========================================================
   CLOSE FINAL
========================================================= */

function closeFinal(){

  document.getElementById("overlay").style.display=
    "none";
}

/* =========================================================
   START
========================================================= */

applySelection();
renderItems();
updateLevelUI();

</script>

</body>
</html>
