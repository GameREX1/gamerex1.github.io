<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GamerEx - Glam Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#f7e8ff,#ffeaf4,#e8f4ff);
  color:#292033;
  overflow-x:hidden;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}

.game{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  min-height:72px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(120,70,160,.15);
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#d83c91;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.coinBox,
.levelBox{
  padding:10px 14px;
  border-radius:25px;
  font-size:13px;
  font-weight:bold;
}

.coinBox{
  background:#fff0fa;
  color:#b62675;
}

.levelBox{
  background:#f0ebff;
  color:#6546a0;
}

/* MAIN */

.main{
  flex:1;
  display:grid;
  grid-template-columns:260px 1fr 340px;
  gap:18px;
  padding:18px;
  max-width:1550px;
  width:100%;
  margin:auto;
}

/* PANELS */

.panel{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(130,70,160,.12);
  border-radius:22px;
  box-shadow:0 12px 35px rgba(80,40,100,.08);
  padding:16px;
}

.panelTitle{
  font-size:18px;
  margin-bottom:13px;
}

/* CATEGORIES */

.categories{
  display:grid;
  gap:9px;
}

.cat{
  width:100%;
  padding:13px;
  border-radius:14px;
  background:#f8f3fb;
  color:#51415e;
  text-align:left;
  transition:.2s;
}

.cat:hover,
.cat.active{
  background:#d83c91;
  color:white;
  transform:translateX(3px);
}

/* STAGE */

.stage{
  min-height:690px;
  border-radius:25px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:linear-gradient(#dff5ff,#fff0fa);
  box-shadow:0 12px 35px rgba(80,40,100,.1);
  perspective:1200px;
}

.bg1{
  background:linear-gradient(#dff6ff 0%,#f8e9ff 58%,#f8cfe3 100%);
}

.bg2{
  background:linear-gradient(#fff1c7,#ffd9e9 60%,#e5c9ff);
}

.bg3{
  background:linear-gradient(#d9ffe9,#d9e9ff 55%,#f4d7ff);
}

.bg4{
  background:linear-gradient(#25233e,#55436c 55%,#171526);
}

.room{
  position:absolute;
  inset:0;
}

.window{
  position:absolute;
  width:170px;
  height:220px;
  top:50px;
  left:50%;
  transform:translateX(-50%);
  border:12px solid rgba(255,255,255,.8);
  background:linear-gradient(120deg,#c5ecff,#fbd6ed);
  box-shadow:0 12px 30px rgba(70,50,90,.12);
}

.floor{
  position:absolute;
  bottom:0;
  width:100%;
  height:27%;
  background:rgba(255,255,255,.3);
  border-top:2px solid rgba(255,255,255,.65);
}

/* ROTATION */

.character3d{
  position:relative;
  width:300px;
  height:610px;
  z-index:5;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.2,.8,.2,1);
  transform-origin:center center;
  margin-bottom:-5px;
}

.character3d.flipped{
  transform:rotateY(180deg);
}

.character,
.backCharacter{
  position:absolute;
  inset:0;
  width:300px;
  height:610px;
  transform-style:preserve-3d;
  backface-visibility:hidden;
}

.character{
  transform:rotateY(0deg);
}

.backCharacter{
  transform:rotateY(180deg);
}

/* RIGHT PANEL */

.itemsPanel{
  display:flex;
  flex-direction:column;
  min-height:650px;
}

.items{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  overflow-y:auto;
  padding-right:3px;
  max-height:390px;
}

.item{
  min-height:82px;
  border-radius:14px;
  background:#f7f2fa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:.2s;
  color:#4b3c55;
  position:relative;
}

.item:hover{
  transform:translateY(-3px);
  background:#f4ddec;
}

.item.selected{
  outline:3px solid #d83c91;
  background:#ffe9f6;
}

.item.locked{
  opacity:.65;
}

.itemIcon{
  font-size:28px;
}

.itemName{
  font-size:11px;
  text-align:center;
}

.price{
  font-size:10px;
  color:#a06a20;
}

.lock{
  position:absolute;
  top:5px;
  right:6px;
  font-size:13px;
}

/* LEVEL BOX */

.levelProgress{
  margin-top:12px;
  background:#f6f1ff;
  padding:12px;
  border-radius:15px;
}

.levelTop{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
}

.progressBar{
  height:9px;
  background:#e6ddf0;
  border-radius:20px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#d83c91,#8d5be8);
  border-radius:20px;
  transition:.3s;
}

/* SCORE */

.scoreBox{
  margin-top:12px;
  background:#fff4fa;
  padding:12px;
  border-radius:15px;
  text-align:center;
}

.score{
  font-size:26px;
  font-weight:900;
  color:#d83c91;
}

/* BUTTONS */

.bottomButtons{
  margin-top:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding-top:14px;
}

.action{
  padding:12px 8px;
  border-radius:13px;
  background:#efe8f4;
  color:#4a3b52;
}

.action.primary{
  background:#d83c91;
  color:white;
}

.action.ad{
  background:#f3b63f;
  color:#382300;
  grid-column:1/-1;
}

.action.rotate{
  background:#7456d9;
  color:white;
  grid-column:1/-1;
}

/* LEVELS PANEL */

.levelPanel{
  margin-top:14px;
  background:#faf7ff;
  border-radius:16px;
  padding:12px;
}

.levelPanelTitle{
  font-weight:900;
  margin-bottom:8px;
  font-size:14px;
}

.challenge{
  font-size:12px;
  line-height:1.5;
  color:#655970;
}

/* POPUP */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(35,22,42,.55);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal{
  width:min(500px,100%);
  background:white;
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.modal h2{
  margin-bottom:8px;
  color:#d83c91;
}

.modal p{
  color:#685d70;
  margin-bottom:18px;
}

.reward{
  background:#fff4ca;
  color:#916a00;
  padding:12px;
  border-radius:14px;
  margin:12px 0;
  font-weight:bold;
}

.close{
  background:#d83c91;
  color:white;
  padding:12px 25px;
  border-radius:12px;
}

/* MOBILE */

  );

    JSON.stringify(unlocked)
  );

}

===================================================== */

  document.getElementById("coins").textContent=coins;

  saveGame();

}


/* =====================================================
   CATEGORY
===================================================== */

function selectCategory(category,button){

  currentCategory=category;

  document.querySelectorAll(".cat").forEach(x=>{
    x.classList.remove("active");
  });

  button.classList.add("active");

  renderItems();

}


/* =====================================================
   ITEM UNLOCK KEY
===================================================== */

function itemKey(category,index){

  return category+"_"+index;

}


function isUnlocked(category,index){

  const item=data[category][index];

  if(!item.cost || item.cost===0){
    return true;
  }

  return !!unlocked[itemKey(category,index)];

}


/* =====================================================
   ITEMS
===================================================== */

function renderItems(){

  const container=document.getElementById("items");

  container.innerHTML="";

  const title={

    outfit:"👗 Choose an Outfit",
    hair:"💇 Choose a Hairstyle",
    makeup:"💄 Choose Makeup",
    shoes:"👠 Choose Shoes",
    bags:"👜 Choose a Bag",
    jewelry:"💎 Choose Jewelry",
    glasses:"🕶️ Choose Glasses",
    background:"🏠 Choose a Room"

  };

  document.getElementById("itemTitle").textContent=
    title[currentCategory];


  data[currentCategory].forEach((item,index)=>{

    const btn=document.createElement("button");

    const unlockedItem=isUnlocked(
      currentCategory,
      index
    );

    btn.className="item";

    if(state[currentCategory]===index){
      btn.classList.add("selected");
    }

    if(!unlockedItem){
      btn.classList.add("locked");
    }

    btn.innerHTML=`

      ${
        !unlockedItem
        ? '<div class="lock">🔒</div>'
        : ''
      }

      <div class="itemIcon">
        ${item.icon}
      </div>

      <div class="itemName">
        ${item.name}
      </div>

      ${
        item.cost>0 && !unlockedItem
        ? `<div class="price">🪙 ${item.cost}</div>`
        : ''
      }

    `;


    btn.onclick=()=>{

      if(!unlockedItem){

        if(coins<item.cost){

          alert(
            "Not enough coins! 🪙\n\n" +
            "Complete levels or watch the optional ad demo to earn more coins."
          );

          return;

        }

        const buy=confirm(
          `Unlock ${item.name} for ${item.cost} coins?`
        );

        if(!buy){
          return;
        }

        coins-=item.cost;

        unlocked[itemKey(
          currentCategory,
          index
        )]=true;

        updateCoins();

      }

      state[currentCategory]=index;

      applySelection();

      renderItems();

    };


    container.appendChild(btn);

  });

}

  const shoe=data.shoes[state.shoes];

  document.getElementById("shoeR").className=

/* =====================================================
   SCORE
===================================================== */

function updateScore(){

  let score=50;


  if(state.outfit!==0){
    score+=8;
  }

  if(state.hair!==0){
    score+=7;
  }

  if(state.makeup!==0){
    score+=8;
  }

  if(state.shoes!==0){
    score+=5;
  }

  if(state.bags!==0){
    score+=5;
  }

  if(state.jewelry!==0){
    score+=6;
  }

  if(state.glasses!==0){
    score+=4;
  }


  if(
    state.makeup===4 &&
    state.jewelry>=2 &&
    state.outfit>=2
  ){

    score+=7;

  }


  if(
    state.bags!==0 &&
    state.shoes!==0
  ){

    score+=3;

  }


  score=Math.min(score,100);


  document.getElementById("score").textContent=
    score;


  return score;

}


/* =====================================================
   LEVEL UI
===================================================== */

function updateLevelUI(){

  document.getElementById("level").textContent=

  document.getElementById("levelSmall").textContent=
    level;


  const current=levels[level] || levels[6];

  const percent=Math.min(
    (xp/100)*100,
    100
  );


  document.getElementById("xpText").textContent=
    xp+" / 100 XP";


  document.getElementById("progressFill").style.width=
    percent+"%";


  document.getElementById("challengeText").textContent=
    current.text;

}


/* =====================================================
   ADD XP
===================================================== */

function addXP(amount){

  xp+=amount;


  while(xp>=100){

    xp-=100;

    if(level<6){

      level++;

      coins+=100;

      alert(
        "🎉 Level Up!\n\n" +
        "You reached Level "+level+"!\n" +
        "Bonus: +100 coins 🪙"
      );

    }else{

      xp=100;

      break;

    }

  }


  updateCoins();

  updateLevelUI();

}

   RANDOM LOOK
===================================================== */

  Object.keys(state).forEach(key=>{

    const available=[];

    data[key].forEach((item,index)=>{

      if(isUnlocked(key,index)){
        available.push(index);
      }

    });

    if(available.length){

      state[key]=
        available[
          Math.floor(
            Math.random()*available.length
          )
        ];

    }

  });


  applySelection();

  renderItems();

}


/* =====================================================
   RESET
===================================================== */

function resetLook(){

  state={

    outfit:0,
    hair:0,
    makeup:0,
    shoes:0,
    bags:0,
    jewelry:0,
    glasses:0,
    background:0

  };


  applySelection();

  renderItems();

}


/* =====================================================
   BACKGROUND
===================================================== */

function changeBackground(){

  state.background=
    (state.background+1) %
    data.background.length;


  applySelection();


  if(currentCategory==="background"){

    renderItems();

  }

}


/* =====================================================
   ROTATE CHARACTER
===================================================== */

function rotateCharacter(){

  flipped=!flipped;

  const character=
    document.getElementById("character3d");

  if(flipped){

    character.classList.add("flipped");

  }else{

    character.classList.remove("flipped");

  }

}


/* =====================================================
   WATCH AD DEMO
===================================================== */

function watchAd(){

  if(adCooldown){

    alert(
      "Please wait a little before watching another ad."
    );

    return;

  }


  adCooldown=true;


  const button=
    document.querySelector(".action.ad");


  const oldText=
    button.textContent;


  let seconds=5;


  button.disabled=true;

  button.textContent=
    "📺 Ad playing... "+seconds;


  const timer=setInterval(()=>{

    seconds--;

    button.textContent=
      "📺 Ad playing... "+seconds;


    if(seconds<=0){

      clearInterval(timer);

      coins+=50;

      updateCoins();

      button.disabled=false;

      button.textContent=
        oldText;

      adCooldown=false;


      alert(
        "🎁 Ad reward received!\n\n" +
        "+50 Style Coins 🪙"
      );

    }

  },1000);

}


/* =====================================================
   FINAL LOOK
===================================================== */

function showFinal(){

  const score=updateScore();

  const current=levels[level] || levels[6];


  let message=
    "Nice look! Keep experimenting! 💖";


  if(score>=90){

    message=
      "WOW! You're a true fashion superstar! ✨👑";

  }
  else if(score>=75){

    message=
      "Amazing style! This look is gorgeous! 💕";

  }
  else if(score>=60){

    message=
      "Great look! Keep experimenting! 🌸";

  }


  document.getElementById("finalText").textContent=
    message;


  document.getElementById("finalScore").textContent=
    score+"/100";


  const rewardText=
    document.getElementById("rewardText");


  if(
    score>=current.target &&
    !challengeRewardClaimed
  ){

    const reward=current.reward;

    challengeRewardClaimed=true;

    coins+=reward;

    addXP(25);

    updateCoins();


    rewardText.textContent=
      "🎉 Challenge Complete! +" +
      reward +
      " coins and +25 XP! 🪙⭐";

  }
  else if(score>=current.target){

    rewardText.textContent=
      "✅ Challenge already completed! Keep styling!";

  }
  else{

    rewardText.textContent=
      "🎯 Reach "+current.target+
      " points to complete Level "+
      level+
      " and earn "+current.reward+
      " coins.";

  }


  document.getElementById("overlay").style.display=
    "flex";


  saveGame();

}


/* =====================================================
   CLOSE FINAL
===================================================== */

function closeFinal(){

  document.getElementById("overlay").style.display=
    "none";

}


/* =====================================================
   START
===================================================== */

applySelection();

renderItems();

updateCoins();

updateLevelUI();

</script>
